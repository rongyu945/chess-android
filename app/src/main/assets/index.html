    // ===================== 提示（设置里开启「需要提示」后可用） =====================
    // 用最高档搜索替玩家想一步，并在棋盘上把"起点→终点"标绿；玩家走子后自动消失。
    clearHint() { this.hintMove = null; }

    showHint() {
        if (this.gameOver || this.isAnimating || this._hintRunning) return;
        if (this.gameMode === 'pvc' && this.currentPlayer !== this.getPlayerColorValue()) {
            this.showToast('现在轮到对方走棋');
            return;
        }
        // 同一手已经提示过 → 直接重新高亮，不重复搜索
        if (this.hintMove && this._hintPly === this.sanHistory.length) {
            this.render();
            this.showToast('建议：' + (this.hintMove._san || '高亮着法'));
            return;
        }
        this._hintRunning = true;
        if (this.hintBtnEl) this.hintBtnEl.classList.add('busy');
        this.showToast('正在为你思考…');
        const token = this.animationToken;
        setTimeout(() => {
            let move = null;
            try {
                move = ChessEngine.findBestMove(this.board, this.currentPlayer, this.castlingRights, this.enPassantTarget, 4, undefined, this.sanHistory);
            } catch (e) { move = null; }
            this._hintRunning = false;
            if (this.hintBtnEl) this.hintBtnEl.classList.remove('busy');
            if (token !== this.animationToken) return;   // 期间已走子/重开 → 丢弃这次结果
            if (!move) { this.showToast('暂时没有可走的着法'); return; }
            move._san = this.moveSAN(move, this.board);
            this.hintMove = move;
            this._hintPly = this.sanHistory.length;
            this.render();
            this.showToast('建议：' + move._san);
        }, 40);
    }

    getPlayerColorValue() {
        return this.playerColor === 'b' ? ChessEngine.BLACK : ChessEngine.WHITE;
    }

    getAIColorValue() {
        return this.playerColor === 'b' ? ChessEngine.WHITE : ChessEngine.BLACK;
    }

    toggleAI() {
        if (this.practiceMode) { this.showToast('练习模式固定为人机对练'); return; }
        this.animationToken++;   // 作废进行中的 AI 走子动画（与重开/悔棋/认输保持一致）
        this.isAnimating = false;
        if (this.gameMode === 'pvc') {
            this.gameMode = 'pvp';
            this.stopAI();
            this.stopAIBtn.textContent = '人机对战';
            this.stopAIBtn.classList.remove('danger');
            this.stopAIBtn.classList.add('primary');
            this.resignBtn.textContent = '认输';
            this.colorSliderWrapEl.style.display = 'none';   // 双人模式选色无意义，隐藏
            this.showToast('已切换到双人对战');
            this.render();
        } else {
            this.gameMode = 'pvc';
            this.stopAIBtn.textContent = '双人对战';
            this.stopAIBtn.classList.remove('primary');
            this.resignBtn.textContent = '认输';
            this.colorSliderWrapEl.style.display = '';       // 恢复滑块
            this.newGame();
            this.showToast('已切换回人机对战');
        }
    }

    // 根据对局状态禁用/启用操作按钮（游戏结束后认输不可点）
    updateControlsState() {
        if (this.resignBtn) {
            this.resignBtn.disabled = this.gameOver;
            this.resignBtn.textContent = this.practiceMode ? '放弃本题' : '认输';
        }
        if (this.undoBtn) this.undoBtn.disabled = this.gameOver;
        if (this.stopAIBtn) {
            // 练习模式固定人机对练，不允许切成双人
            this.stopAIBtn.disabled = this.gameOver || this.practiceMode;
            this.stopAIBtn.style.opacity = this.practiceMode ? '0.45' : '';
        }
    }

    resign() {
        if (this.gameOver || this.playerColor === null) return;
        if (this.practiceMode) {
            this.showModal('放弃本题', '确定要放弃当前这道练习题吗？', 'confirm', () => this.practiceFinish(false, '已放弃本题，可以再来一次。'));
            return;
        }
        // 认输前二次确认，防手滑
        this.showModal('认输', this.gameMode === 'pvp' ? '确定要认输吗？' : '确定要认输吗？（本局判负）', 'confirm', () => this.doResign());
    }

    doResign() {
        if (this.gameOver || this.playerColor === null) return;
        this.stopAI();
        this.animationToken++;
        this.gameOver = true;
        // 赢家：双人模式是对方，人机模式是 AI
        let winner;
        if (this.gameMode === 'pvp') {
            winner = this.currentPlayer === ChessEngine.WHITE ? '黑方' : '白方';
        } else {
            winner = 'AI（' + (this.playerColor === 'w' ? '黑方' : '白方') + '）';
        }
        this.showModal('认输', `${winner}获胜！`, 'end');
        SoundManager.playGameEnd();
        this.updateControlsState();
        this.render();
    }

    stopAI() {
        this._aiGen = (this._aiGen || 0) + 1;   // 让进行中的搜索/待执行回调失效
        if (this.aiFrame) {
            cancelAnimationFrame(this.aiFrame);
            this.aiFrame = null;
        }
        if (this.aiTimer) {
            clearTimeout(this.aiTimer);
            this.aiTimer = null;
        }
        if (this.abortController) {
            this.abortController.abort();
            this.abortController = null;
        }
        this.isThinking = false;
        this.clearAnimationElements();
        this.render();
    }

    clearAnimationElements() {
        this.boardWrapper.querySelectorAll('.animating-piece, .captured-piece-anim').forEach(el => el.remove());
    }

    saveState() {
        this.historyStack.push({
            board: JSON.parse(JSON.stringify(this.board)),
            currentPlayer: this.currentPlayer,
            capturedByWhite: [...this.capturedByWhite],
            capturedByBlack: [...this.capturedByBlack],
            castlingRights: this.castlingRights,
            enPassantTarget: this.enPassantTarget ? [...this.enPassantTarget] : null,
            lastMove: this.lastMove ? JSON.parse(JSON.stringify(this.lastMove)) : null,
            positionHistory: [...this.positionHistory],
            halfMoveClock: this.halfMoveClock
        });
    }

    getSquarePixelPos(r, c) {
        // 执黑时棋盘翻转，物理排布上下颠倒；逻辑坐标 (r,c) 映射到物理位置
        const dispR = this.getDisplayRow(r);
        const dispC = this.getDisplayCol(c);
        const rect = this.boardWrapper.getBoundingClientRect();
        const size = rect.width / 8;
        return { x: dispC * size, y: dispR * size, size };
    }

    getDisplayRow(r) {
        // 当前玩家在下方：执黑翻转，否则原样
        return this.isFlipped() ? (7 - r) : r;
    }

    // 双人模式：旋转"远离你的那一种颜色"（棋盘上方的颜色）。
    // 执白不翻转时上方是黑棋、执黑翻转后上方是白棋，所以跟随棋盘朝向而非写死黑色。
    getTopColor() {
        return this.isFlipped() ? ChessEngine.WHITE : ChessEngine.BLACK;
    }

    pieceFacingUp(piece) {
        // 双人模式：旋转上方的棋子（远离当前视角）。非 pvp 一律不旋转。
        return this.gameMode === 'pvp' && ChessEngine.getPieceColor(piece) === this.getTopColor();
    }

    getDisplayCol(c) {
        return this.isFlipped() ? (7 - c) : c;
    }

    buildBoardDOM() {
        this.boardEl.innerHTML = '';
        this._squareEls = {};
        // 按显示顺序生成格子：翻转时先放显示行 0（物理顶部）= 逻辑第 7 行
        for (let dispR=0; dispR<8; dispR++) {
            for (let dispC=0; dispC<8; dispC++) {
                const r = this.getLogicRow(dispR);
                const c = this.getLogicCol(dispC);
                const sq = document.createElement('div');
                // 棋盘格子颜色由逻辑位置决定，翻转只影响排布
                const baseClass = `square ${(r+c)%2===0 ? 'light' : 'dark'}`;
                sq.className = baseClass;
                sq.dataset.row = r;
                sq.dataset.col = c;
                const coordFile = document.createElement('span');
                coordFile.className = 'coord coord-file';
                coordFile.textContent = FILES[c];
                const coordRank = document.createElement('span');
                coordRank.className = 'coord coord-rank';
                coordRank.textContent = 8 - r;
                sq.appendChild(coordFile);
                sq.appendChild(coordRank);
                sq.addEventListener('click', () => this.onSquareClick(r, c));
                this.boardEl.appendChild(sq);
                this._squareEls[r + ',' + c] = { sq, baseClass, shownPiece: undefined };
            }
        }
        this._flippedRendered = this.isFlipped();
    }

    getLogicRow(dispR) {
        return this.isFlipped() ? (7 - dispR) : dispR;
    }

    getLogicCol(dispC) {
        return this.isFlipped() ? (7 - dispC) : dispC;
    }

    render() {
        this.clearAnimationElements();
        if (!this._squareEls) {
            this.buildBoardDOM();
        }
        const inCheckNow = ChessEngine.isInCheck(this.board, this.currentPlayer);
        const checkKing = inCheckNow ? this.currentPlayer * ChessEngine.KING : 0;
        for (let r=0; r<8; r++) {
            for (let c=0; c<8; c++) {
                const info = this._squareEls[r + ',' + c];
                const sq = info.sq;
                const piece = this.board[r][c];
                let cls = info.baseClass;
                if (this.selectedSquare && this.selectedSquare[0]===r && this.selectedSquare[1]===c) {
                    cls += ' selected';
                }
                if (this.validMoves.some(m => m.to[0]===r && m.to[1]===c)) {
                    cls += piece !== 0 ? ' valid-capture' : ' valid-move';
                }
                if (this.lastMove) {
                    if ((this.lastMove.from[0]===r && this.lastMove.from[1]===c) ||
                        (this.lastMove.to[0]===r && this.lastMove.to[1]===c)) {
                        cls += ' last-move';
                    }
                }
                if (piece === checkKing) {
                    cls += ' in-check';
                }
                if (this.hintMove && !this.gameOver) {
                    if (this.hintMove.from[0]===r && this.hintMove.from[1]===c) cls += ' hint-from';
                    if (this.hintMove.to[0]===r && this.hintMove.to[1]===c) cls += ' hint-to';
                }
                sq.className = cls;
                if (info.shownPiece !== piece) {
                    info.shownPiece = piece;
                    const old = sq.querySelector('.piece-glyph');
                    if (old) old.remove();
                    if (piece !== 0) {
                        const span = document.createElement('span');
                        span.className = 'piece-glyph';
                        span.textContent = PIECE_SYMBOLS[piece];
                        span.style.position = 'relative';
                        span.style.zIndex = '2';
                        if (this.pieceFacingUp(piece)) {
                            span.classList.add('piece-rotated');
                        }
                        sq.appendChild(span);
                    }
                } else if (piece !== 0) {
                    const span = sq.querySelector('.piece-glyph');
                    if (span) {
                        span.style.visibility = '';
                        span.classList.toggle('piece-rotated', this.pieceFacingUp(piece));
                    }
                }
            }
        }
        this.updateStatus(inCheckNow);
        this.updateCaptured();
        this.updateMoveHistory();
    }

    onSquareClick(r, c) {
        if (this.gameOver || this.isThinking || this.isAnimating) return;
        if (this.gameMode === 'pvc' && this.currentPlayer !== this.getPlayerColorValue()) return;
        const piece = this.board[r][c];
        if (this.selectedSquare) {
            const move = this.validMoves.find(m => m.to[0]===r && m.to[1]===c);
            if (move) {
                if (move.promotion) {
                    this.showPromotionModal(move);
                } else {
                    this.executeMoveWithAnimation(move);
                }
                return;
            }
        }
        if (piece !== 0 && ChessEngine.getPieceColor(piece) === this.currentPlayer) {
            this.selectedSquare = [r, c];
            this.validMoves = this.getLegalMovesForPiece(r, c);
            this.render();
        } else {
            this.selectedSquare = null;
            this.validMoves = [];
            this.render();
        }
    }

    getLegalMovesForPiece(r, c) {
        const allMoves = ChessEngine.generateMoves(this.board, this.currentPlayer, this.castlingRights, this.enPassantTarget);
        return allMoves.filter(m => m.from[0]===r && m.from[1]===c)
            .filter(m => !ChessEngine.isInCheck(ChessEngine.makeMove(this.board, m), this.currentPlayer));
    }

    async executeMoveWithAnimation(move) {
        if (this.isAnimating) return;
        const token = ++this.animationToken;
        this.isAnimating = true;
        this.humanMoved = true;   // 玩家落子（人机模式下用于滑块切换判定；双人模式双方都算）
        this.selectedSquare = null;
        this.validMoves = [];
        this.render();   // 立刻清掉选中高亮与落点灰点：否则整段走子动画期间灰点还挂在棋盘上
        this.saveState();
        const piece = this.board[move.from[0]][move.from[1]];
        const isCapture = move.captured !== 0 || move.enPassant;
        this.clearAnimationElements();

        const fromPos = this.getSquarePixelPos(move.from[0], move.from[1]);
        const toPos = this.getSquarePixelPos(move.to[0], move.to[1]);

        const animPiece = document.createElement('div');
        animPiece.className = 'animating-piece';
        const glyph = document.createElement('span');
        glyph.textContent = PIECE_SYMBOLS[move.promotion || piece];
        if (this.pieceFacingUp(move.promotion || piece)) {
            glyph.classList.add('piece-rotated');
        }
        animPiece.appendChild(glyph);
        animPiece.style.left = fromPos.x + 'px';
        animPiece.style.top = fromPos.y + 'px';
        animPiece.style.width = fromPos.size + 'px';
        animPiece.style.height = fromPos.size + 'px';
        this.boardWrapper.appendChild(animPiece);

        // 走子时隐藏起点棋子字形，让棋子真正"离开"起点，避免动画期间一格两影
        const fromSquare = this.boardEl.querySelector(`[data-row="${move.from[0]}"][data-col="${move.from[1]}"]`);
        if (fromSquare) {
            const glyphEl = fromSquare.querySelector('.piece-glyph');
            if (glyphEl) glyphEl.style.visibility = 'hidden';
        }

        let capturedAnimEl = null;
        if (isCapture) {
            let capR, capC;
            if (move.enPassant) { capR = move.from[0]; capC = move.to[1]; }
            else { capR = move.to[0]; capC = move.to[1]; }
            const capPos = this.getSquarePixelPos(capR, capC);
            capturedAnimEl = document.createElement('div');
            capturedAnimEl.className = 'captured-piece-anim';
            const movingColor = ChessEngine.getPieceColor(piece);
            const capturedVal = move.enPassant ? (-movingColor * ChessEngine.PAWN) : move.captured;
            const capGlyph = document.createElement('span');
            capGlyph.textContent = PIECE_SYMBOLS[capturedVal];
            if (this.pieceFacingUp(capturedVal)) {
                capGlyph.classList.add('piece-rotated');
            }
            capturedAnimEl.appendChild(capGlyph);
            capturedAnimEl.style.left = capPos.x + 'px';
            capturedAnimEl.style.top = capPos.y + 'px';
            capturedAnimEl.style.width = capPos.size + 'px';
            capturedAnimEl.style.height = capPos.size + 'px';
            this.boardWrapper.appendChild(capturedAnimEl);
        }

        await new Promise(resolve => {
            // rAF 在后台标签页会被节流导致永不触发，用 setTimeout 兜底，保证动画一定能走完
            const rafId = requestAnimationFrame(resolve);
            setTimeout(() => { cancelAnimationFrame(rafId); resolve(); }, 50);
        });
        if (token !== this.animationToken) { this.isAnimating = false; this.isThinking = false; return; }
        animPiece.style.transform = `translate(${toPos.x - fromPos.x}px, ${toPos.y - fromPos.y}px)`;
        if (capturedAnimEl) capturedAnimEl.classList.add('vanish');
        await new Promise(resolve => setTimeout(resolve, 320));
        if (token !== this.animationToken) { this.isAnimating = false; this.isThinking = false; return; }

        animPiece.remove();
        if (capturedAnimEl) capturedAnimEl.remove();

        if (isCapture) SoundManager.playCapture();
        else SoundManager.playMove();

        this.finalizeMove(move);
        this.isAnimating = false;
    }

    finalizeMove(move) {
        if (move.captured !== 0) {
            if (ChessEngine.getPieceColor(move.captured) === ChessEngine.WHITE) {
                this.capturedByBlack.push(move.captured);
            } else {
                this.capturedByWhite.push(move.captured);
            }
        }
        const sanPrevBoard = this.board;   // 记谱消歧义需要走子前棋盘
        this.board = ChessEngine.makeMove(this.board, move);
        this.castlingRights = ChessEngine.getCastlingRights(this.board, this.castlingRights);
        this.enPassantTarget = ChessEngine.getEnPassantTarget(this.board, move);
        this.lastMove = move;
        this.sanHistory.push(this.moveSAN(move, sanPrevBoard));
        this.currentPlayer = -this.currentPlayer;
        const moverColor = -this.currentPlayer;   // 刚落子的一方
        this.hintMove = null;                     // 走过子后提示自动失效
        this.updatePositionHistory();
        this.saveGameState();          // 每步落子后存档（关掉 App 也能接着下）
        // 练习模式：先判"是否达成目标"，再判"是否超出步数"
        if (this.practiceMode && !this.practiceDone) {
            const ex = PRACTICE_POSITIONS[this.practiceIndex];
            const playerJustMoved = moverColor === this.getPlayerColorValue();
            this.updatePracticeUI();          // 每步刷新"已用 X/Y 步"和进度条
            if (playerJustMoved && ex && ex.win === 'promote' && move.promotion) {
                this.render();
                this.practiceFinish(true, '兵已升变，胜势已定。');
                return;
            }
            if (playerJustMoved && ex && this.getPracticeUsed() > ex.limit) {
                this.render();
                this.practiceFinish(false, `超过 ${ex.limit} 步的上限了，再试一次。`);
                return;
            }
        }
        this.render();
        // 检查王是否被吃
        this.checkKingCapture();
        if (this.checkGameEnd()) {
            if (!this.practiceMode) SoundManager.playGameEnd();   // 练习模式的音效在 practiceFinish 里播
            return;
        }
        if (this.gameMode === 'pvc' && this.currentPlayer === this.getAIColorValue()) {
            this.aiMoveWithDelay();
        }
    }

    checkKingCapture() {
        const whiteKingExists = this.board.some(row => row.includes(ChessEngine.WHITE * ChessEngine.KING));
        const blackKingExists = this.board.some(row => row.includes(ChessEngine.BLACK * ChessEngine.KING));
        if (!whiteKingExists || !blackKingExists) {
            this.gameOver = true;
            const winner = !whiteKingExists ? '黑方' : '白方';
            this.showModal('王被吃', `${winner}获胜！`, 'end');
            SoundManager.playGameEnd();
        }
    }

    aiMoveWithDelay() {
        if (this.gameMode !== 'pvc') return;
        this.isThinking = true;
        this.render();
        this.abortController = new AbortController();
        const ac = this.abortController;
        const aiColor = this.getAIColorValue();
        const gen = ++this._aiGen;   // 本次搜索代号：被中断（重开/悔棋/认输/切模式）后自动失效
        const stale = () => gen !== this._aiGen || ac.aborted;
        const runSearch = () => {
            if (stale()) { this.isThinking = false; this.render(); return; }
            const move = ChessEngine.findBestMove(
                this.board, aiColor, this.castlingRights, this.enPassantTarget,
                this.difficulty, ac.signal, this.sanHistory
            );
            if (move && !stale()) {
                this.executeAIMove(move);
            } else {
                this.isThinking = false;
                this.render();
                this.checkGameEnd();
            }
        };
        // 搜索是同步阻塞的：理想情况是先让浏览器画一帧（"AI思考中"提示 + 棋盘更新）再开搜，
        // 否则界面会停在上一帧的画面上（旧提示、残留灰点），看起来像卡住。
        // 但 rAF 在后台标签页/不出帧的环境里根本不会触发，所以必须用定时器兜底 —— 两个谁先到算谁。
        let started = false;
        const start = () => {
            if (started) return;
            started = true;
            if (this.aiFrame) { cancelAnimationFrame(this.aiFrame); this.aiFrame = null; }
            if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
            runSearch();
        };
        this.aiFrame = requestAnimationFrame(start);
        this.aiTimer = setTimeout(start, 100);
    }

    async executeAIMove(move) {
        if (this.isAnimating) return;
        const token = ++this.animationToken;
        this.saveState();
        this.isAnimating = true;
        this.selectedSquare = null;
        this.validMoves = [];
        this.render();   // 立刻清掉残留的选中高亮/灰点（AI 走子期间不该还留着玩家的落点提示）
        const piece = this.board[move.from[0]][move.from[1]];
        const isCapture = move.captured !== 0 || move.enPassant;
        this.clearAnimationElements();

        const fromPos = this.getSquarePixelPos(move.from[0], move.from[1]);
        const toPos = this.getSquarePixelPos(move.to[0], move.to[1]);
        // 距离自适应：按位移格数决定动画时长，单格与玩家手动走子完全一致(0.32s)，走得越远越从容
        // （用格数而非像素，避免不同屏幕尺寸下速度漂移）
        const squares = Math.max(Math.abs(move.to[0]-move.from[0]), Math.abs(move.to[1]-move.from[1])); // 位移格数
        const animDuration = Math.max(0.32, Math.min(0.9, squares * 0.32)); // 秒：单格=0.32s(与手动相同)，每多一格累加


        const animPiece = document.createElement('div');
        animPiece.className = 'animating-piece';   // 不用 CSS transition, 改用 rAF 逐帧插值(Android WebView 对 transition 合成不可靠)
        const glyph = document.createElement('span');
        glyph.textContent = PIECE_SYMBOLS[move.promotion || piece];
        if (this.pieceFacingUp(move.promotion || piece)) {
            glyph.classList.add('piece-rotated');
        }
        animPiece.appendChild(glyph);
        // 用 vision-free 的绝对定位: left/top 由 rAF 逐帧推进, 无需 transform/transition
        animPiece.style.position = 'absolute';
        animPiece.style.willChange = 'left, top';
        const sizePx = fromPos.size + 'px';
        animPiece.style.width = sizePx;
        animPiece.style.height = sizePx;
        animPiece.style.zIndex = '60';
        this.boardWrapper.appendChild(animPiece);

        // 走子时隐藏起点棋子字形，让棋子真正"离开"起点，避免动画期间一格两影
        const fromSquare = this.boardEl.querySelector(`[data-row="${move.from[0]}"][data-col="${move.from[1]}"]`);
        if (fromSquare) {
            const glyphEl = fromSquare.querySelector('.piece-glyph');
            if (glyphEl) glyphEl.style.visibility = 'hidden';
        }

        let capturedAnimEl = null;
        if (isCapture) {
            let capR, capC;
            if (move.enPassant) { capR = move.from[0]; capC = move.to[1]; }
            else { capR = move.to[0]; capC = move.to[1]; }
            const capPos = this.getSquarePixelPos(capR, capC);
            capturedAnimEl = document.createElement('div');
            capturedAnimEl.className = 'captured-piece-anim';
            const movingColor = ChessEngine.getPieceColor(piece);
            const capturedVal = move.enPassant ? (-movingColor * ChessEngine.PAWN) : move.captured;
            const capGlyph = document.createElement('span');
            capGlyph.textContent = PIECE_SYMBOLS[capturedVal];
            if (this.pieceFacingUp(capturedVal)) {
                capGlyph.classList.add('piece-rotated');
            }
            capturedAnimEl.appendChild(capGlyph);
            capturedAnimEl.style.left = capPos.x + 'px';
            capturedAnimEl.style.top = capPos.y + 'px';
            capturedAnimEl.style.width = capPos.size + 'px';
            capturedAnimEl.style.height = capPos.size + 'px';
            this.boardWrapper.appendChild(capturedAnimEl);
        }

        // ---- rAF 逐帧滑动动画 (不依赖 CSS transition, 各渲染环境一致) ----
        const dx = toPos.x - fromPos.x, dy = toPos.y - fromPos.y;
        animPiece.style.left = fromPos.x + 'px';
        animPiece.style.top = fromPos.y + 'px';
        const startTime = performance.now();
        await new Promise(resolve => {
            // 后台标签页 rAF 会被节流暂停导致动画永不结束，用 setTimeout 兜底强制走完，防止 isAnimating 卡死
            let settled = false, guardTimer = null;
            const finish = () => { if (settled) return; settled = true; if (guardTimer) clearTimeout(guardTimer); resolve(); };
            let lastNow = performance.now();
            let stuckCount = 0;
            const step = (now) => {
                if (token !== this.animationToken) { finish(); return; }
                // 兜底：若 rAF 长时间不触发（后台），强制结束
                if (now - lastNow > 300) stuckCount++;
                lastNow = now;
                if (stuckCount >= 20) { finish(); return; }
                const t = Math.min(1, (now - startTime) / (animDuration * 1000));
                // 平滑缓入缓出 (easeInOutCubic)
                const e = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
                animPiece.style.left = (fromPos.x + dx * e) + 'px';
                animPiece.style.top = (fromPos.y + dy * e) + 'px';
                if (t < 1 && !settled) {
                    requestAnimationFrame(step);
                } else {
                    finish();
                }
            };
            requestAnimationFrame(step);
            // 绝对兜底：超过 (动画时长+1s) 仍未结束就去掉 rAF 依赖，直接收尾（正常结束时由 finish 清掉）
            guardTimer = setTimeout(() => finish(), animDuration * 1000 + 1000);
        });
        // 动画期间若已重开对局/悔棋/认输(token 变化)，这一步作废 —— 否则会把着法落到新局面上（幽灵走子）
        if (token !== this.animationToken) { this.isAnimating = false; this.isThinking = false; this.clearAnimationElements(); return; }
        animPiece.remove();
        if (capturedAnimEl) capturedAnimEl.remove();

        if (isCapture) SoundManager.playCapture();
        else SoundManager.playMove();

        if (move.captured !== 0) {
            if (ChessEngine.getPieceColor(move.captured) === ChessEngine.WHITE) {
                this.capturedByBlack.push(move.captured);
            } else {
                this.capturedByWhite.push(move.captured);
            }
        }
        const sanPrevBoard = this.board;   // 记谱消歧义需要走子前棋盘
        this.board = ChessEngine.makeMove(this.board, move);
        this.castlingRights = ChessEngine.getCastlingRights(this.board, this.castlingRights);
        this.enPassantTarget = ChessEngine.getEnPassantTarget(this.board, move);
        this.lastMove = move;
        this.sanHistory.push(this.moveSAN(move, sanPrevBoard));
        this.currentPlayer = this.getPlayerColorValue();
        this.updatePositionHistory();
        this.isThinking = false;
        this.isAnimating = false;
        this.render();
        this.checkKingCapture();
        if (this.checkGameEnd()) {
            SoundManager.playGameEnd();
            return;
        }
    }

    updatePositionHistory() {
        const key = ChessEngine.positionKey(this.board, this.currentPlayer, this.castlingRights, this.enPassantTarget);
        this.positionHistory.push(key);
        const lastMove = this.lastMove;
        if (lastMove.captured !== 0 || Math.abs(lastMove.piece) === ChessEngine.PAWN) {
            this.halfMoveClock = 0;
        } else {
            this.halfMoveClock++;
        }
        if (this.positionHistory.length > 200) {
            this.positionHistory = this.positionHistory.slice(-100);
        }
    }

    checkGameEnd() {
        if (this.gameOver) return true;
        const moves = ChessEngine.generateMoves(this.board, this.currentPlayer, this.castlingRights, this.enPassantTarget);
        const legalMoves = moves.filter(m => !ChessEngine.isInCheck(ChessEngine.makeMove(this.board,m), this.currentPlayer));
        if (legalMoves.length === 0) {
            this.gameOver = true;
            if (ChessEngine.isInCheck(this.board, this.currentPlayer)) {
                const winnerColorValue = -this.currentPlayer;
                if (this.practiceMode) {
                    const ok = winnerColorValue === this.getPlayerColorValue();
                    this.practiceFinish(ok, ok ? '漂亮的将杀！' : '被对方将杀了，再试一次。');
                    return true;
                }
                const winnerName = winnerColorValue === ChessEngine.WHITE ? '白方' : '黑方';
                const winner = (this.gameMode === 'pvc' && winnerColorValue === this.getAIColorValue()) ? 'AI' : winnerName;
                this.showModal('将杀！', `${winner}获胜！`, 'end');
            } else {
                if (this.practiceMode) {
                    this.practiceFinish(false, '逼和了——杀王时要给对方留一口气，让它无路可走就是和棋。');
                    return true;
                }
                this.showModal('逼和', '和棋！', 'end');
            }
            return true;
        }
        const key = ChessEngine.positionKey(this.board, this.currentPlayer, this.castlingRights, this.enPassantTarget);
        const count = this.positionHistory.filter(k => k === key).length;
        if (count >= 3) {
            this.gameOver = true;
            if (this.practiceMode) { this.practiceFinish(false, '三次重复成和——练习时要主动求变。'); return true; }
            this.showModal('三次重复', '和棋！', 'end');
            return true;
        }
        if (this.halfMoveClock >= 100) {
            this.gameOver = true;
            if (this.practiceMode) { this.practiceFinish(false, '触发五十步规则成和——推进得太慢了。'); return true; }
            this.showModal('五十步规则', '和棋！', 'end');
            return true;
        }
        if (this.isInsufficientMaterial()) {
            this.gameOver = true;
            if (this.practiceMode) { this.practiceFinish(false, '子力不足成和——追杀的棋子被吃掉了，再试一次。'); return true; }
            this.showModal('子力不足', '和棋！', 'end');
            return true;
        }
        return false;
    }

    isInsufficientMaterial() {
        const pieces = { white: [], black: [] };
        for (let r=0; r<8; r++) for (let c=0; c<8; c++) {
            const p = this.board[r][c];
            if (p !== 0) {
                const color = ChessEngine.getPieceColor(p);
                const type = ChessEngine.getPieceType(p);
                if (color === ChessEngine.WHITE) pieces.white.push(type);
                else pieces.black.push(type);
            }
        }
        const isInsufficient = (arr) => {
            const nonKing = arr.filter(t => t !== ChessEngine.KING);
            if (nonKing.length === 0) return true;                       // 仅王
            if (nonKing.length === 1) {                                  // 王+单马 / 王+单象
                return nonKing[0] === ChessEngine.KNIGHT || nonKing[0] === ChessEngine.BISHOP;
            }
            // 王+双马：无法强制将杀（对手不配合即为和棋），按子力不足判和
            if (nonKing.length === 2 && nonKing.every(t => t === ChessEngine.KNIGHT)) return true;
            return false;
        };
        return isInsufficient(pieces.white) && isInsufficient(pieces.black);
    }

    showPromotionModal(move) {
        this.pendingPromotionMove = move;
        this.promotionPiecesEl.innerHTML = '';
        const promoColor = this.currentPlayer;
        [ChessEngine.QUEEN, ChessEngine.ROOK, ChessEngine.BISHOP, ChessEngine.KNIGHT].forEach(p => {
            const el = document.createElement('span');
            el.className = 'promotion-piece';
            el.textContent = PIECE_SYMBOLS[promoColor * p];
            el.addEventListener('click', () => {
                move.promotion = promoColor * p;
                this.hideModal();
                this.executeMoveWithAnimation(move);
            });
            this.promotionPiecesEl.appendChild(el);
        });
        this.modalTitleEl.textContent = '兵升变';
        this.modalMessageEl.textContent = '请选择升变棋子';
        this.modalCloseEl.style.display = 'none';
        // 升变不是结束，也不需确认：确保不残留上次弹窗的按钮行
        this.modalConfirmRowEl.classList.remove('show');
        this.modalEndRowEl.classList.remove('show');
        this.pendingConfirm = null;
        this.modalEl.classList.add('show');
    }

    // mode: 'plain'(仅确定) | 'confirm'(取消/确认) | 'end'(看看棋盘/再来一局)
    showModal(title, message, mode = 'plain', confirmFn = null) {
        if (mode === 'end') this.clearSavedGame();   // 对局已结束，不再保留续下存档
        this.modalTitleEl.textContent = title;
        this.modalMessageEl.textContent = message;
        this.promotionPiecesEl.innerHTML = '';
        this.pendingConfirm = confirmFn;
        this.modalCloseEl.style.display = mode === 'plain' ? 'inline-block' : 'none';
        this.modalConfirmRowEl.classList.toggle('show', mode === 'confirm');
        this.modalEndRowEl.classList.toggle('show', mode === 'end');
        if (this.modalPracticeRowEl) this.modalPracticeRowEl.classList.toggle('show', mode === 'practice');
        this.modalEl.classList.add('show');
    }

    hideModal() {
        this.modalEl.classList.remove('show');
        this.pendingConfirm = null;
    }

    // 轻提示气泡
    showToast(text) {
        if (!this.toastEl) return;
        this.toastEl.textContent = text;
        this.toastEl.classList.add('show');
        if (this._toastTimer) clearTimeout(this._toastTimer);
        this._toastTimer = setTimeout(() => this.toastEl.classList.remove('show'), 2200);
    }

    updateStatus(inCheck = false) {
        if (this.gameOver) {
            this.thinkingIndicator.classList.remove('show');
            this.statusBarEl.classList.remove('check-alert');
            return;
        }
        // 将军提示：状态栏背景变红，播放音效（避免重复播放）
        if (inCheck) {
            this.statusBarEl.classList.add('check-alert');
            if (!this._checkSoundPlayed) {
                SoundManager.playCheck();
                this._checkSoundPlayed = true;
            }
        } else {
            this.statusBarEl.classList.remove('check-alert');
            this._checkSoundPlayed = false;
        }
        let turnName;
        if (this.gameMode === 'pvc') {
            turnName = this.currentPlayer === this.getPlayerColorValue() ? '您' : 'AI';
        } else {
            turnName = this.currentPlayer === ChessEngine.WHITE ? '白方' : '黑方';
        }
        this.statusTextEl.textContent = inCheck ? `${turnName}被将军！` : `轮到${turnName}走棋`;
        this.turnIndicator.className = `turn-indicator ${this.currentPlayer === ChessEngine.WHITE ? 'white' : 'black'}`;
        const evalScore = ChessEngine.evaluate(this.board);
        // evaluate 返回白方视角（正=白优）。记分牌要显示"己方"（执棋方）胜率：
        // 执白乘 +1，执黑乘 -1（相反数），即显示黑方视角。pvp 双人模式显示白方视角。
        const myView = this.gameMode === 'pvc' ? this.getPlayerColorValue() : ChessEngine.WHITE;
        const myEval = evalScore * myView;
        const myStr = (myEval > 0 ? '+' : '') + (myEval/100).toFixed(1);
        const colorName = (this.gameMode === 'pvc' && this.playerColor === 'b') ? '黑方' : '白方';
        this.evalScoreEl.textContent = `${colorName}优势：${myStr}`;
        if (this.isThinking) {
            this.thinkingIndicator.classList.add('show');
            // AI 思考时隐藏优势分，避免状态栏右侧同时出现两个元素在窄屏换行、把棋盘顶下去
            this.evalScoreEl.style.display = 'none';
        } else {
            this.thinkingIndicator.classList.remove('show');
            this.evalScoreEl.style.display = '';
        }
    }

    updateCaptured() {
        const fmt = arr => arr.map(p => `<span class="captured-piece">${PIECE_SYMBOLS[p]}</span>`).join('');
        // 战果归属要跟随棋盘朝向：玩家自己的战果始终显示在玩家那一侧（下方）。
        // 执白时玩家在下方 → 下方=capturedByWhite；执黑翻转后 → 下方=capturedByBlack。
        const topArr = this.isFlipped() ? this.capturedByWhite : this.capturedByBlack;
        const bottomArr = this.isFlipped() ? this.capturedByBlack : this.capturedByWhite;
        const topHtml = fmt(topArr);
        const bottomHtml = fmt(bottomArr);
        if (this._capTopHtml !== topHtml) { this._capTopHtml = topHtml; this.capturedByBlackEl.innerHTML = topHtml; }
        if (this._capBottomHtml !== bottomHtml) { this._capBottomHtml = bottomHtml; this.capturedByWhiteEl.innerHTML = bottomHtml; }
    }

    // ===================== 走棋记录点击回溯 =====================
    // 点记录里的某一手 → 回到"那一手走之前"的局面（相当于连续悔棋到那一步）。
    // historyStack[i] 存的正是第 i 手走之前的状态，与 sanHistory 一一对应。
    rewindToPly(ply) {
        if (this.isAnimating || this._hintRunning || this.practiceDone) return;
        if (!Number.isInteger(ply) || ply < 0 || ply >= this.sanHistory.length) return;
        if (this.gameOver && !this.practiceMode) { this.showToast('对局已结束，请点“新对局”重开'); return; }
        const discard = this.sanHistory.length - ply;
        if (discard >= 6) {
            const moveNo = Math.floor(ply/2) + 1;
            const side = (ply % 2 === 0) ? '白方' : '黑方';
            this.showModal('回溯确认', `将放弃后面的 ${discard} 手棋，回到第 ${moveNo} 手${side}走棋之前。`, 'confirm', () => this.applyRewind(ply));
        } else {
            this.applyRewind(ply);
        }
    }

    applyRewind(ply) {
        const snap = this.historyStack[ply];
        if (!snap) return;
        this.animationToken++;
        this.stopAI();
        this.board = snap.board.map(r => r.slice());
        this.currentPlayer = snap.currentPlayer;
        this.capturedByWhite = [...snap.capturedByWhite];
        this.capturedByBlack = [...snap.capturedByBlack];
        this.castlingRights = snap.castlingRights;
        this.enPassantTarget = snap.enPassantTarget;
        this.lastMove = snap.lastMove;
        this.positionHistory = [...snap.positionHistory];
        this.halfMoveClock = snap.halfMoveClock;
        this.historyStack = this.historyStack.slice(0, ply);
        this.sanHistory = this.sanHistory.slice(0, ply);
        this.gameOver = false;
        this.isThinking = false;
        this.isAnimating = false;
        this.selectedSquare = null;
        this.validMoves = [];
        this.hintMove = null;
        this._checkSoundPlayed = false;
        this.render();
        if (this.practiceMode) this.updatePracticeUI();
        this.updateControlsState();
        this.saveGameState();
        const mine = this.currentPlayer === this.getPlayerColorValue();
        this.showToast(`已回到第 ${Math.floor(ply/2)+1} 手之前` + (mine ? '，该你走' : ''));
        if (this.gameMode === 'pvc' && this.currentPlayer === this.getAIColorValue()) this.aiMoveWithDelay();
    }

    updateMoveHistory() {
        let html = '';
        const last = this.sanHistory.length - 1;
        for (let i=0; i<this.sanHistory.length; i+=2) {
            const num = Math.floor(i/2)+1;
            const w = this.sanHistory[i] || '';
            const b = this.sanHistory[i+1] || '';
            html += `<span class="move-entry">${num}.`;
            if (w) html += `<button class="ply${i === last ? ' cur' : ''}" data-ply="${i}">${w}</button>`;
            if (b) html += `<button class="ply${i+1 === last ? ' cur' : ''}" data-ply="${i+1}">${b}</button>`;
            html += `</span>`;
        }
        if (this.moveHistoryEl) this.moveHistoryEl.classList.toggle('rewindable', this.sanHistory.length > 1);
        if (this._moveListHtml !== html) {
            this._moveListHtml = html;
            this.moveListEl.innerHTML = html;
            this.moveListEl.scrollTop = this.moveListEl.scrollHeight;
        }
    }

    moveSAN(move, prevBoard) {
        if (!move) return '';
        // 将军/将杀后缀先算出来：易位也可能造成将军(O-O+)，不能提前 return 把它漏掉
        let suffix = '';
        try {
            const oppColor = -this.currentPlayer;
            if (ChessEngine.isInCheck(this.board, oppColor)) {
                const oppLegal = ChessEngine.generateMoves(this.board, oppColor, this.castlingRights, this.enPassantTarget)
                    .filter(m => !ChessEngine.isInCheck(ChessEngine.makeMove(this.board, m), oppColor));
                suffix = oppLegal.length === 0 ? '#' : '+';
            }
        } catch (e) { /* 不因记谱问题中断走子 */ }
        if (move.castling === 'K') return 'O-O' + suffix;
        if (move.castling === 'Q') return 'O-O-O' + suffix;
        const type = Math.abs(move.piece);
        const toFile = FILES[move.to[1]];
        const toRank = 8 - move.to[0];
        let sym = '';
        if (type === ChessEngine.KNIGHT) sym='N';
        else if (type === ChessEngine.BISHOP) sym='B';
        else if (type === ChessEngine.ROOK) sym='R';
        else if (type === ChessEngine.QUEEN) sym='Q';
        else if (type === ChessEngine.KING) sym='K';
        const isCapture = move.enPassant || (move.captured !== 0 && move.captured !== undefined);
        const cap = isCapture ? (type === ChessEngine.PAWN ? FILES[move.from[1]] : '') + 'x' : '';
        const promoSuffix = move.promotion ? '=' + {2:'N',3:'B',4:'R',5:'Q'}[Math.abs(move.promotion)] : '';

        // 消歧义：若存在另一枚同色同型子也能走到目标格，按标准SAN标注来源列/行
        let disambig = '';
        if (type !== ChessEngine.PAWN && type !== ChessEngine.KING && prevBoard) {
            const myColor = ChessEngine.getPieceColor(move.piece);
            const rivals = ChessEngine.generateMoves(prevBoard, myColor, this.castlingRights || 'KQkq', this.enPassantTarget || null)
                .filter(m => !(m.from[0]===move.from[0] && m.from[1]===move.from[1]))
                .filter(m => Math.abs(m.piece) === type)   // 只考虑同类型棋子竞争目标格
                .filter(m => m.to[0]===move.to[0] && m.to[1]===move.to[1]);
            if (rivals.length > 0) {
                const sameFile = rivals.some(m => m.from[1]===move.from[1]);
                const sameRank = rivals.some(m => m.from[0]===move.from[0]);
                if (!sameFile) disambig = FILES[move.from[1]];
                else if (!sameRank) disambig = String(8-move.from[0]);
                else disambig = `${FILES[move.from[1]]}${8-move.from[0]}`;
            }
        }

        // 后缀(suffix)已在函数开头算好（易位分支也要用）
        return `${sym}${disambig}${cap}${toFile}${toRank}${promoSuffix}${suffix}`;
    }

    // ===================== 练习模式 =====================
    // 玩家已走的手数（按记谱长度和执色推算，悔棋/回溯后自动正确）
    getPracticeUsed() {
        const idx = this.getPlayerColorValue() === ChessEngine.WHITE ? 0 : 1;
        let n = 0;
        for (let i = idx; i < this.sanHistory.length; i += 2) n++;
        return n;
    }

    startPractice(index) {
        const n = PRACTICE_POSITIONS.length;
        this.practiceIndex = ((index % n) + n) % n;
        const ex = PRACTICE_POSITIONS[this.practiceIndex];
        this.animationToken++;
        this.stopAI();
        // 按题目摆子（棋盘坐标：行 0 = 第8横线，列 0 = a 线）
        const map = { K:ChessEngine.KING, Q:ChessEngine.QUEEN, R:ChessEngine.ROOK, B:ChessEngine.BISHOP, N:ChessEngine.KNIGHT, P:ChessEngine.PAWN };
        const b = Array(8).fill().map(() => Array(8).fill(0));
        for (const [ch, r, c] of ex.pieces) {
            const up = String(ch).toUpperCase();
            if (map[up] === undefined) continue;
            b[r][c] = (String(ch) === up) ? map[up] : -map[up];
        }
        this.board = b;
        this.playerColor = ex.player;
        delete this._squareEls;               // 朝向由题目决定，重建格子
        this.currentPlayer = (ex.player === 'w') ? ChessEngine.WHITE : ChessEngine.BLACK;
        this.castlingRights = '';
        this.enPassantTarget = null;
        this.selectedSquare = null;
        this.validMoves = [];
        this.historyStack = [];
        this.sanHistory = [];
        this.capturedByWhite = [];
        this.capturedByBlack = [];
        this.lastMove = null;
        this.gameOver = false;
        this.isThinking = false;
        this.isAnimating = false;
        this._checkSoundPlayed = false;
        this.humanMoved = false;
        this.hintMove = null;
        this.practiceDone = false;
        this.halfMoveClock = 0;
        this.positionHistory = [ChessEngine.positionKey(this.board, this.currentPlayer, '', null)];
        this.gameMode = 'pvc';
        this.clearSavedGame();
        this.updateColorSliderUI();
        this.updateControlsState();
        this.updatePracticeUI();
        this.render();
        this.hideModal();
        if (this.currentPlayer === this.getAIColorValue()) this.aiMoveWithDelay();
    }

    updatePracticeUI() {
        if (!this.practiceBarEl) return;
        const ex = PRACTICE_POSITIONS[this.practiceIndex];
        if (!ex) return;
        const used = this.getPracticeUsed();
        const inGroup = PRACTICE_POSITIONS.slice(0, this.practiceIndex + 1).filter(e => e.group === ex.group).length;
        const groupTotal = PRACTICE_POSITIONS.filter(e => e.group === ex.group).length;
        const total = PRACTICE_POSITIONS.length;
        this.practiceNameEl.textContent = `${ex.name}（你执${ex.player === 'w' ? '白' : '黑'}）`;
        this.practiceProgressEl.textContent = `已用 ${used} / ${ex.limit} 步`;
        if (this.practiceMetaEl) this.practiceMetaEl.textContent = `${ex.group} ${inGroup}/${groupTotal} · 全库第 ${this.practiceIndex + 1}/${total} 题`;
        this.practiceGoalEl.textContent = ex.goal;
        if (this.practiceFillEl) {
            const pct = Math.min(100, Math.round(used / ex.limit * 100));
            this.practiceFillEl.style.width = pct + '%';
            this.practiceFillEl.classList.toggle('warn', used >= ex.limit - 2);
        }
    }

    // 选题列表（题多了只靠"下一题"翻太累）
    openPracticePicker() {
        this.buildPracticePicker();
        if (this.practicePickerEl) this.practicePickerEl.classList.add('show');
    }
    closePracticePicker() {
        if (this.practicePickerEl) this.practicePickerEl.classList.remove('show');
    }
    buildPracticePicker() {
        if (!this.practicePickerListEl) return;
        const tag = (ex) => ex.win === 'promote' ? '升变' : (ex.limit <= 3 ? `杀${ex.limit}步` : '将杀');
        let html = '', lastGroup = null;
        PRACTICE_POSITIONS.forEach((ex, i) => {
            if (ex.group !== lastGroup) { lastGroup = ex.group; html += `<div class="picker-group">${ex.group}</div>`; }
            html += `<button class="picker-item${i === this.practiceIndex ? ' cur' : ''}" data-idx="${i}">`
                  + `<span class="picker-no">${i + 1}</span>`
                  + `<span class="picker-name">${ex.name}</span>`
                  + `<span class="picker-tag">${tag(ex)} · ${ex.limit} 步内</span></button>`;
        });
        this.practicePickerListEl.innerHTML = html;
        if (this.practicePickerSubEl) this.practicePickerSubEl.textContent = `共 ${PRACTICE_POSITIONS.length} 题`;
        // 滚动到当前题
        const cur = this.practicePickerListEl.querySelector('.picker-item.cur');
        if (cur) this.practicePickerListEl.scrollTop = Math.max(0, cur.offsetTop - 60);
    }

    // 完成/失败统一入口：锁住棋盘 + 弹窗给出重试/下一题
    practiceFinish(success, detail) {
        if (this.practiceDone) return;
        this.practiceDone = true;
        this.gameOver = true;
        this.isThinking = false;
        this.stopAI();
        this.hintMove = null;
        this.clearSavedGame();
        this.updatePracticeUI();
        this.updateControlsState();
        SoundManager.playGameEnd();
        const ex = PRACTICE_POSITIONS[this.practiceIndex];
        const used = this.getPracticeUsed();
        if (success) {
            this.showModal('完成！', `「${ex.name}」用了 ${used} 步（上限 ${ex.limit} 步）。${detail || ''}`, 'practice');
        } else {
            this.showModal('未完成', `「${ex.name}」已用 ${used} 步，未达成目标。${detail || ''}`, 'practice');
        }
    }

    newGame() {
        if (this.practiceMode) { this.startPractice(this.practiceIndex); return; }
        this.animationToken++;
        this.stopAI();
        // 每局新对局都重新决定执子色：滑块为「随机」时此处重摇一次
        const prevPlayerColor = this.playerColor;
        this.playerColor = this.resolveColor();
        // 执子色变了（白↔黑）→ 棋盘朝向要翻转，必须重建格子 DOM；
        // 否则 render() 会沿用旧朝向的 _squareEls，看起来"翻白翻黑一个样"
        if (this.playerColor !== prevPlayerColor) {
            delete this._squareEls;
        }
        this.updateColorSliderUI();
        this.board = ChessEngine.createInitialBoard();
        this.currentPlayer = ChessEngine.WHITE;
        this.selectedSquare = null;
        this.validMoves = [];
        this.historyStack = [];
        this.sanHistory = [];
        this.capturedByWhite = [];
        this.capturedByBlack = [];
        this.castlingRights = 'KQkq';
        this.enPassantTarget = null;
        this.gameOver = false;
        this.isThinking = false;
        this.isAnimating = false;
        this.lastMove = null;
        // 初始局面也要计入三次重复计数（否则回到开局局面时少算一次，判和会偏晚）
        this.positionHistory = [ChessEngine.positionKey(this.board, ChessEngine.WHITE, this.castlingRights, this.enPassantTarget)];
        this.halfMoveClock = 0;
        this._checkSoundPlayed = false;
        this.humanMoved = false;   // 玩家本局是否已落子（决定滑块切换能否立即生效）
        this.clearSavedGame();     // 新对局覆盖旧存档
        this.updateControlsState();
        this.render();
        this.hideModal();
        // 执黑时白方AI先手，开局即轮到AI则自动走棋；执白时轮到玩家不触发
        if (this.gameMode === 'pvc' && this.currentPlayer === this.getAIColorValue()) {
            this.aiMoveWithDelay();
        }
    }

    undoMove() {
        if (this.gameOver) {
            // 对局已结束：不允许静默复活，明确提示
            this.showToast('对局已结束，请点“新对局”重开');
            return;
        }
        if (this.historyStack.length === 0 || this.isAnimating) return;
        if (this.isThinking) {
            this.stopAI();
        }
        this.animationToken++;
        let pops = 1;
        if (this.gameMode === 'pvc' && this.currentPlayer === this.getPlayerColorValue() && this.historyStack.length >= 2) {
            pops = 2;
        }
        let target = null;
        for (let i = 0; i < pops; i++) {
            target = this.historyStack.pop();
            if (this.sanHistory.length > 0) this.sanHistory.pop();
        }
        if (!target) return;
        this.board = target.board;
        this.currentPlayer = target.currentPlayer;
        this.capturedByWhite = target.capturedByWhite;
        this.capturedByBlack = target.capturedByBlack;
        this.castlingRights = target.castlingRights;
        this.enPassantTarget = target.enPassantTarget;
        this.lastMove = target.lastMove;
        this.positionHistory = target.positionHistory;
        this.halfMoveClock = target.halfMoveClock;
        this.gameOver = false;
        this.selectedSquare = null;
        this.validMoves = [];
        this.isThinking = false;
        this.isAnimating = false;
        this._checkSoundPlayed = false;
        this.render();
        if (this.practiceMode) this.updatePracticeUI();   // 练习模式：已用步数跟着回退
        this.saveGameState();      // 悔棋后的局面也要覆盖存档，避免重开 App 又回到"被悔掉"的局面
        if (this.gameMode === 'pvc' && this.currentPlayer === this.getAIColorValue() && !this.gameOver) {
            this.aiMoveWithDelay();
        }
    }
}

// 启动游戏
const game = new ChessGame();

// 安卓返回键：先关设置面板/弹窗，都没有再退出 App。
// 返回 'handled' 表示已被页面消化，'exit' 表示可以让系统退回。
window.__androidBack = function () {
    try {
        if (game.practicePickerEl && game.practicePickerEl.classList.contains('show')) {
            game.closePracticePicker();
            return 'handled';
        }
        if (game.settingsOverlayEl && game.settingsOverlayEl.classList.contains('show')) {
            game.closeSettings();
            return 'handled';
        }
        if (game.modalEl && game.modalEl.classList.contains('show')) {
            game.hideModal();
            return 'handled';
        }
    } catch (e) { /* 出错则按退出处理 */ }
    return 'exit';
};
</script>
