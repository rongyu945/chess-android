      pieces: [['K',1,2],['P',2,2],['R',7,3],['k',1,4],['r',6,0]] },
];

class ChessGame {
    constructor() {
        this.board = ChessEngine.createInitialBoard();
        this.currentPlayer = ChessEngine.WHITE;
        this.selectedSquare = null;
        this.validMoves = [];
        this.historyStack = [];
        this.sanHistory = [];
        this.capturedByWhite = [];
        this.capturedByBlack = [];
        this.castlingRights = 'KQkq';
        this.enPassantTarget = null;
        this.gameOver = false;
        this.isThinking = false;
        this.isAnimating = false;
        this.difficulty = 1;
        this.colorPreference = 'w'; // 滑块偏好：'w' | 'r'（随机）| 'b'
        // 显示偏好默认值（localStorage 不可用时用它们）
        this.showCoords = true;    // 棋盘坐标
        this.darkMode = false;     // 深色模式
        this.hintOn = false;     // 需要提示（难度行右侧出现提示灯泡）
        this.soundOn = true;      // 音效开关（默认开）
        this.practiceMode = false; // 练习模式（残局题库）
        this.practiceIndex = 0;    // 当前第几题
        this.halfMoveClock = 0;
        this.perpetualCheckCount = 0;   // v7.2.2: 连续无推进将军计数（长将兜底判和）
        this.positionHistory = [];
        this.undoUsed = 0;        // 本局已用悔棋次数（换难度/新对局时清零）
        this.undoCap = 3;         // 本局悔棋上限（随难度只降不升，新对局重置）
        this.undoUsedW = 0;       // 双人模式：白方已用悔棋次数（每人固定 3 次）
        this.undoUsedB = 0;       // 双人模式：黑方已用悔棋次数
        this.pendingSwitch = null;  // 模式切换确认「结束对局」的回调
        // 5.2.7：复盘分析状态
        this._analysisResults = null;
        this._analysisRunning = false;
        this._analysisPly = 0;
        // 优先读取已保存的设置（难度/执色/坐标/深色）
        try {
            const saved = JSON.parse(localStorage.getItem('chessPrefs') || '{}');
            const dif = parseInt(saved.difficulty) || 1;
            // 5.2.11 删"入门"档：旧存档 level4(原大师) 归一为 3(现大师)，其余 1-3 原样
            this.difficulty = (dif >= 1 && dif <= 3) ? dif : (dif === 4 ? 3 : 1);
            this.undoCap = UNDO_LIMITS[this.difficulty] || 3;
            const col = ['w', 'r', 'b'].includes(saved.colorPreference) ? saved.colorPreference : 'w';
            this.colorPreference = col;
            this.showCoords = saved.showCoords !== false;   // 默认显示
            this.darkMode = saved.darkMode === true;        // 默认浅色
            this.hintOn = saved.showHint === true;        // 默认不显示提示灯泡
            this.soundOn = saved.soundOn !== false;       // 默认开启音效
            this.practiceMode = saved.practiceMode === true; // 默认普通对局
            const pi = parseInt(saved.practiceIndex);
            this.practiceIndex = (pi >= 0 && pi < PRACTICE_POSITIONS.length) ? pi : 0;
        } catch (e) { /* localStorage 不可用时静默回退到默认值 */ }
        this.playerColor = null;    // 实际执子色，每局开始时由 resolveColor() 决定
        this.gameMode = 'pvc';     // 默认人机模式
        this.animationToken = 0;
        this.aiFrame = null;   // AI 搜索前的"让出一帧"rAF 句柄
        this.aiTimer = null;   // AI 搜索启动的兜底定时器
        this._aiGen = 0;        // AI 搜索代号（中断即失效）
        this.humanMoved = false;
        this.hintMove = null;      // 当前显示的提示着法
        this._hintRunning = false;
        this.practiceDone = false;
        this.initUI();
        this.applyDisplayPrefs();   // 应用已保存的坐标/深色偏好（须在 initUI 之后，元素已就绪）
        if (this.practiceMode) {
            // 练习模式：每次打开都从当前题目重新开始（练习进度不进存档）
            this.startPractice(this.practiceIndex);
        } else if (!this.restoreGameState()) {
            // 有上次没下完的对局就接着下（安卓后台被杀是最常见的中断场景），否则按滑块开局
            this.render();
            this.applyColorPreference(); // 直接按滑块当前值开局，不再弹窗选色
        }
    }

    // ===================== 对局自动保存 / 恢复 =====================
    // 每步落子后把整局状态写进 localStorage，重开 App 能接着下。
    saveGameState() {
        if (this.gameOver) { this.clearSavedGame(); return; }
        // 练习模式是刷题，不进存档（否则关掉练习模式会莫名恢复到一道残局）
        if (this.practiceMode) { this.clearSavedGame(); return; }
        try {
            localStorage.setItem('chessSavedGame', JSON.stringify({
                v: 1,
                board: this.board,
                currentPlayer: this.currentPlayer,
                castlingRights: this.castlingRights,
                enPassantTarget: this.enPassantTarget,
                sanHistory: this.sanHistory,
                capturedByWhite: this.capturedByWhite,
                capturedByBlack: this.capturedByBlack,
                halfMoveClock: this.halfMoveClock,
                positionHistory: this.positionHistory.slice(-60),
                lastMove: this.lastMove,
                difficulty: this.difficulty,
                gameMode: this.gameMode,
                playerColor: this.playerColor,
                undoUsed: this.undoUsed,
                undoCap: this.undoCap,
                undoUsedW: this.undoUsedW,
                undoUsedB: this.undoUsedB,
                historyStack: this.historyStack
            }));
        } catch (e) { /* 存储不可用（隐私模式等）则放弃保存，不影响下棋 */ }
    }

    clearSavedGame() {
        try { localStorage.removeItem('chessSavedGame'); } catch (e) { /* 忽略 */ }
    }

    // 返回 true 表示成功恢复（调用方就不要再开新局了）
    restoreGameState() {
        let s = null;
        try {
            const raw = localStorage.getItem('chessSavedGame');
            if (raw) s = JSON.parse(raw);
        } catch (e) { s = null; }
        if (!s || !Array.isArray(s.board) || s.board.length !== 8 || !s.board.every(r => Array.isArray(r) && r.length === 8)) {
            this.clearSavedGame(); return false;
        }
        // 盘面自检：双方必须各恰好一个王，着法历史必须是字符串数组；脏数据直接丢弃
        let wk = 0, bk = 0;
        for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
            const v = s.board[r][c];
            if (typeof v !== 'number' || Math.abs(v) > 6) { this.clearSavedGame(); return false; }
            if (v === ChessEngine.KING) wk++;
            if (v === -ChessEngine.KING) bk++;
        }
        if (wk !== 1 || bk !== 1) { this.clearSavedGame(); return false; }
        if (!Array.isArray(s.sanHistory)) { this.clearSavedGame(); return false; }
        try {
            this.board = s.board;
            ChessEngine.invalidateKingCache();  // 5.0.0：恢复对局后重置王位缓存
            this.currentPlayer = (s.currentPlayer === -1 || s.currentPlayer === 1) ? s.currentPlayer : ChessEngine.WHITE;
            this.castlingRights = typeof s.castlingRights === 'string' ? s.castlingRights : '';
            this.enPassantTarget = Array.isArray(s.enPassantTarget) ? s.enPassantTarget : null;
            this.sanHistory = s.sanHistory.filter(x => typeof x === 'string');
            this.capturedByWhite = Array.isArray(s.capturedByWhite) ? s.capturedByWhite.filter(x => typeof x === 'number') : [];
            this.capturedByBlack = Array.isArray(s.capturedByBlack) ? s.capturedByBlack.filter(x => typeof x === 'number') : [];
            this.halfMoveClock = Number.isFinite(s.halfMoveClock) ? s.halfMoveClock : 0;
            this.positionHistory = Array.isArray(s.positionHistory) ? s.positionHistory.filter(x => typeof x === 'number') : [];
            if (this.positionHistory.length === 0) {
                this.positionHistory = [ChessEngine.positionKey(this.board, this.currentPlayer, this.castlingRights, this.enPassantTarget)];
            }
            // 5.2.7：严格校验 lastMove（缺 to/piece 会让 render 崩）
            this.lastMove = (s.lastMove && Array.isArray(s.lastMove.from) && s.lastMove.from.length === 2
                && Array.isArray(s.lastMove.to) && s.lastMove.to.length === 2
                && typeof s.lastMove.piece === 'number') ? s.lastMove : null;
            this.gameMode = s.gameMode === 'pvp' ? 'pvp' : 'pvc';
            this.playerColor = s.playerColor === 'b' ? 'b' : 'w';
            const dif = parseInt(s.difficulty);
            // 5.2.11：旧存档 level4→3（大师）
            if (dif >= 1 && dif <= 3) this.difficulty = dif;
            else if (dif === 4) this.difficulty = 3;
            this.undoUsed = (Number.isFinite(s.undoUsed) && s.undoUsed >= 0) ? s.undoUsed : 0;
            this.undoCap = (Number.isFinite(s.undoCap) && s.undoCap > 0) ? s.undoCap : (UNDO_LIMITS[this.difficulty] || 3);
            this.undoUsedW = (Number.isFinite(s.undoUsedW) && s.undoUsedW >= 0) ? s.undoUsedW : 0;
            this.undoUsedB = (Number.isFinite(s.undoUsedB) && s.undoUsedB >= 0) ? s.undoUsedB : 0;
            this.gameOver = false;
            this.isThinking = false;
            this.isAnimating = false;
            this.selectedSquare = null;
            this.validMoves = [];
            // 恢复悔棋栈（允许跨后台悔棋）。只接受结构合法的条目，脏/缺失则回退为空
            this.historyStack = Array.isArray(s.historyStack)
                ? s.historyStack.filter(e => e && Array.isArray(e.board) && e.board.length === 8 &&
                    e.board.every(r => Array.isArray(r) && r.length === 8) &&
                    (e.currentPlayer === -1 || e.currentPlayer === 1))
                : [];
            this._checkSoundPlayed = false;
            this.humanMoved = this.sanHistory.length > 0;
            delete this._squareEls;        // 朝向可能和当前 playerColor 不一致，重建格子 DOM
            this.updateColorSliderUI();
            this.updateControlsState();
            this.render();
            this.showToast('已恢复上次对局');
            if (this.gameMode === 'pvc' && this.currentPlayer === this.getAIColorValue()) {
                this.aiMoveWithDelay();
            }
            return true;
        } catch (e) {
            this.clearSavedGame();
            return false;
        }
    }

    isFlipped() {
        // 执黑时黑棋在下方，棋盘 180° 翻转
        return this.playerColor === 'b';
    }

    // 「随机」每次调用都重新摇一次 → 每局新对局都会重新随机
    resolveColor() {
        return this.colorPreference === 'r' ? (Math.random() < 0.5 ? 'w' : 'b') : this.colorPreference;
    }

    // 持久化设置（难度/执色/坐标/深色）
    savePrefs() {
        try {
            localStorage.setItem('chessPrefs', JSON.stringify({
                difficulty: this.difficulty,
                colorPreference: this.colorPreference,
                showCoords: this.showCoords,
                darkMode: this.darkMode,
                showHint: this.hintOn,
                soundOn: this.soundOn,
                practiceMode: this.practiceMode,
                practiceIndex: this.practiceIndex
            }));
        } catch (e) { /* 忽略存储失败 */ }
    }

    // 应用显示偏好（棋盘坐标 / 深色模式），并同步面板里开关的状态
    applyDisplayPrefs() {
        SoundManager.setMuted(!this.soundOn);   // 音效开关实时生效
        document.body.classList.toggle('hide-coords', !this.showCoords);
        document.body.classList.toggle('dark', !!this.darkMode);
        document.body.classList.toggle('show-hint', !!this.hintOn);
        document.body.classList.toggle('practice', !!this.practiceMode);
        this.updateSettingsUI();
    }

    updateSettingsUI() {
        const sync = (el, on) => {
            if (!el) return;
            el.classList.toggle('on', !!on);
            el.setAttribute('aria-checked', on ? 'true' : 'false');
        };
        sync(this.switchCoordsEl, this.showCoords);
        sync(this.switchDarkEl, this.darkMode);
        sync(this.switchHintEl, this.hintOn);
        sync(this.switchSoundEl, this.soundOn);
        sync(this.switchPracticeEl, this.practiceMode);
    }

    toggleCoords() {
        this.showCoords = !this.showCoords;
        this.applyDisplayPrefs();
        this.savePrefs();
        this.showToast(this.showCoords ? '已显示棋盘坐标' : '已关闭棋盘坐标');
    }

    toggleDark() {
        this.darkMode = !this.darkMode;
        this.applyDisplayPrefs();
        this.savePrefs();
        this.showToast(this.darkMode ? '已切换深色模式' : '已切换浅色模式');
    }

    toggleHint() {
        this.hintOn = !this.hintOn;
        this.applyDisplayPrefs();
        this.savePrefs();
        this.showToast(this.hintOn ? '已开启提示按钮' : '已关闭提示按钮');
    }

    toggleSound() {
        this.soundOn = !this.soundOn;
        SoundManager.setMuted(!this.soundOn);
        this.updateSettingsUI();
        this.savePrefs();
        if (this.soundOn) SoundManager.playMove();   // 开启时播一声确认
        this.showToast(this.soundOn ? '已开启音效' : '已关闭音效');
    }

    togglePractice() {
        this.practiceMode = !this.practiceMode;
        this.applyDisplayPrefs();
        this.savePrefs();
        this.hintMove = null;
        if (this.practiceMode) {
            this.showToast('练习模式已开启');
            this.startPractice(this.practiceIndex);
        } else {
            this.showToast('已退出练习模式');
            this.newGame();
        }
    }

    openSettings() { if (this.settingsOverlayEl) this.settingsOverlayEl.classList.add('show'); }
    closeSettings() { if (this.settingsOverlayEl) this.settingsOverlayEl.classList.remove('show'); }

    // 长按绑定：隐形入口用（无任何视觉提示），触摸/鼠标都支持，移动或抬起即取消
    bindLongPress(el, fn, ms) {
        const hold = ms || 600;
        const start = () => {
            this._cancelLongPress();
            this._lpTimer = setTimeout(() => { this._lpTimer = null; fn(); }, hold);
        };
        const cancel = () => this._cancelLongPress();
        el.addEventListener('touchstart', start, { passive: true });
        el.addEventListener('touchend', cancel);
        el.addEventListener('touchcancel', cancel);
        el.addEventListener('touchmove', cancel, { passive: true });
        el.addEventListener('mousedown', start);
        el.addEventListener('mouseup', cancel);
        el.addEventListener('mouseleave', cancel);
        el.addEventListener('contextmenu', (e) => e.preventDefault());   // 屏蔽系统长按菜单
    }

    _cancelLongPress() {
        if (this._lpTimer) { clearTimeout(this._lpTimer); this._lpTimer = null; }
    }

    applyColorPreference() {
        this.newGame();
    }

    // 滑块切到某个偏好
    onColorPreferenceChange(pref) {
        if (this.colorPreference === pref) return;
        this.colorPreference = pref;
        this.savePrefs();

        // 玩家自己还没走过子时重开是"零损失"的，立即生效；已经交战则不打断当前对局，下一局生效
        const canApplyNow = !this.humanMoved && !this.gameOver;

        if (!canApplyNow) {
            if (!this.gameOver) this.showColorHint('新颜色将在下一局生效');
            this.updateColorSliderUI();
            return;
        }
        this.updateColorSliderUI();
        this.applyColorPreference();
    }

    showColorHint(text) {
        const hintEl = this.colorSliderHintEl;
        if (!hintEl) return;
        hintEl.textContent = text;
        hintEl.classList.add('show');
        if (this._colorHintTimer) clearTimeout(this._colorHintTimer);
        this._colorHintTimer = setTimeout(() => hintEl.classList.remove('show'), 2500);
    }

    // 同步滑块 UI（高亮当前项 + 滑块位移）
    updateColorSliderUI() {
        if (!this.colorSliderEl) return;
        const opts = Array.from(this.colorSliderEl.querySelectorAll('.color-slider-opt'));
        const idx = Math.max(0, opts.findIndex(o => o.dataset.color === this.colorPreference));
        opts.forEach((o, i) => o.classList.toggle('active', i === idx));
        if (this.colorSliderThumbEl) {
            this.colorSliderThumbEl.style.transform = `translateX(${idx * 100}%)`;
        }
    }

    initUI() {
        this.boardEl = document.getElementById('board');
        this.boardWrapper = document.getElementById('boardWrapper');
        this.statusTextEl = document.getElementById('statusText');
        this.turnIndicator = document.getElementById('turnIndicator');
        this.evalScoreEl = document.getElementById('evalScore');
        this.thinkingIndicator = document.getElementById('thinkingIndicator');
        this.thinkingTimerEl = document.getElementById('thinkingTimer');
        this.capturedByBlackEl = document.getElementById('capturedByBlack');
        this.capturedByWhiteEl = document.getElementById('capturedByWhite');
        this.moveListEl = document.getElementById('moveList');
        this.moveHistoryEl = document.getElementById('moveHistory');
        this.moveHistoryTitleEl = document.getElementById('moveHistoryTitle');
        // 走棋记录折叠：默认收起，点标题展开/收起
        this.moveHistoryTitleEl.addEventListener('click', () => {
            this.moveHistoryEl.classList.toggle('collapsed');
        });
        // 5.2.7：走棋记录点击 → 复盘评价 or 回溯（之前只写了 CSS 和函数，从未绑定事件）
        this.moveListEl.addEventListener('click', (e) => {
            const plyEl = e.target && e.target.closest ? e.target.closest('.ply') : null;
            if (!plyEl) return;
            const ply = parseInt(plyEl.dataset.ply);
            if (isNaN(ply)) return;
            // 5.2.8：只在复盘完成后显示该步评价；无复盘结果时点击无反应（不再回溯弃棋）
            if (this._analysisResults && this._analysisResults.length) this._showAnalysisForPly(ply);
        });
        this.modalEl = document.getElementById('modal');
        this.modalTitleEl = document.getElementById('modalTitle');
        this.modalMessageEl = document.getElementById('modalMessage');
        this.modalPracticeResultEl = document.getElementById('modalPracticeResult');
        this.promotionPiecesEl = document.getElementById('promotionPieces');
        this.modalCloseEl = document.getElementById('modalCloseBtn');
        this.stopAIBtn = document.getElementById('stopAIBtn');
        this.newGameBtn = document.getElementById('newGameBtn');
        this.difficultyLabelEl = document.getElementById('difficultyLabel');
        this.practicePickBtn = document.getElementById('practicePickBtn');
        if (this.practicePickBtn) this.practicePickBtn.addEventListener('click', () => this.openPracticePicker());
        this.statusBarEl = document.getElementById('status');
        this.colorSliderWrapEl = document.getElementById('colorSliderWrap');
        this.colorSliderEl = document.getElementById('colorSlider');
        this.colorSliderThumbEl = document.getElementById('colorSliderThumb');
        this.colorSliderHintEl = document.getElementById('colorSliderHint');
        this.modalConfirmRowEl = document.getElementById('modalConfirmRow');
        this.modalEndRowEl = document.getElementById('modalEndRow');
        this.modalSwitchRowEl = document.getElementById('modalSwitchRow');
        this.resignBtn = document.getElementById('resignBtn');
        this.undoBtn = document.getElementById('undoBtn');
        this.toastEl = document.getElementById('toast');
        // 精细设置面板（长按顶部标题唤出）
        this.settingsOverlayEl = document.getElementById('settingsOverlay');
        this.switchCoordsEl = document.getElementById('switchCoords');
        this.switchDarkEl = document.getElementById('switchDark');
        this.switchHintEl = document.getElementById('switchHint');
        this.switchSoundEl = document.getElementById('switchSound');
        this.switchPracticeEl = document.getElementById('switchPractice');
        this.hintBtnEl = document.getElementById('hintBtn');
        this.practiceBarEl = document.getElementById('practiceBar');
        this.practiceNameEl = document.getElementById('practiceName');
        this.practiceProgressEl = document.getElementById('practiceProgress');
        this.practiceGoalEl = document.getElementById('practiceGoal');
        this.practiceFillEl = document.getElementById('practiceFill');
        this.practiceMetaEl = document.getElementById('practiceMeta');
        this.practicePickerEl = document.getElementById('practicePicker');
        this.practicePickerListEl = document.getElementById('practicePickerList');
        this.practicePickerSubEl = document.getElementById('practicePickerSub');
        this.modalPracticeRowEl = document.getElementById('modalPracticeRow');
        // 5.2.7：对方侧倒置悔棋按钮（pvp 显示）
        this.oppUndoBtnEl = document.getElementById('oppUndoBtn');
        if (this.switchCoordsEl) this.switchCoordsEl.addEventListener('click', () => this.toggleCoords());
        if (this.switchDarkEl) this.switchDarkEl.addEventListener('click', () => this.toggleDark());
        if (this.switchHintEl) this.switchHintEl.addEventListener('click', () => this.toggleHint());
        if (this.switchSoundEl) this.switchSoundEl.addEventListener('click', () => this.toggleSound());
        if (this.switchPracticeEl) this.switchPracticeEl.addEventListener('click', () => this.togglePractice());
        // 提示按钮
        if (this.hintBtnEl) this.hintBtnEl.addEventListener('click', () => this.showHint());
        // 练习面板
        const pRetry = document.getElementById('practiceRetryBtn');
        const pNext = document.getElementById('practiceNextBtn');
        const pPrev = document.getElementById('practicePrevBtn');
        if (pRetry) pRetry.addEventListener('click', () => this.startPractice(this.practiceIndex));
        if (pNext) pNext.addEventListener('click', () => this.startPractice(this.practiceIndex + 1));
        if (pPrev) pPrev.addEventListener('click', () => this.startPractice(this.practiceIndex - 1));
        // 点题名 → 打开选题列表（20 题只靠"下一题"翻太累）
        if (this.practiceNameEl) this.practiceNameEl.addEventListener('click', () => this.openPracticePicker());
        const pClose = document.getElementById('practicePickerClose');
        if (pClose) pClose.addEventListener('click', () => this.closePracticePicker());
        if (this.practicePickerEl) {
            this.practicePickerEl.addEventListener('click', (e) => { if (e.target === this.practicePickerEl) this.closePracticePicker(); });
        }
        if (this.practicePickerListEl) {
            this.practicePickerListEl.addEventListener('click', (e) => {
                const btn = (e.target && e.target.closest) ? e.target.closest('.picker-item') : null;
                if (!btn) return;
                const idx = parseInt(btn.dataset.idx);
                this.closePracticePicker();
                if (!isNaN(idx)) this.startPractice(idx);
            });
        }
        const mpRetry = document.getElementById('modalPracticeRetry');
        const mpNext = document.getElementById('modalPracticeNext');
        if (mpRetry) mpRetry.addEventListener('click', () => { this.hideModal(); this.startPractice(this.practiceIndex); });
        if (mpNext) mpNext.addEventListener('click', () => { this.hideModal(); this.startPractice(this.practiceIndex + 1); });
        const settingsCloseBtn = document.getElementById('settingsClose');
        if (settingsCloseBtn) settingsCloseBtn.addEventListener('click', () => this.closeSettings());
        if (this.settingsOverlayEl) {
            this.settingsOverlayEl.addEventListener('click', (e) => { if (e.target === this.settingsOverlayEl) this.closeSettings(); });
        }
        const headerEl = document.querySelector('.header');
        if (headerEl) this.bindLongPress(headerEl, () => this.openSettings(), 600);   // 长按仍是兼容入口
        // v7.7.0：可见的设置齿轮（旧版只有隐形长按，新用户根本找不到精细设置）
        const gear = document.getElementById('settingsGear');
        if (gear) gear.addEventListener('click', () => this.openSettings());
        this.bindKeyboardShortcuts();
        if (this.colorSliderEl) {
            this.colorSliderEl.querySelectorAll('.color-slider-opt').forEach(btn => {
                btn.addEventListener('click', () => this.onColorPreferenceChange(btn.dataset.color));
            });
        }
        document.getElementById('modalCancelBtn').addEventListener('click', () => { this.pendingConfirm = null; this.hideModal(); });
        document.getElementById('modalConfirmBtn').addEventListener('click', () => {
            const fn = this.pendingConfirm;
            this.pendingConfirm = null;
            this.hideModal();
            if (fn) fn();
        });
        document.getElementById('modalEndCloseBtn').addEventListener('click', () => this.hideModal());
        document.getElementById('modalRematchBtn').addEventListener('click', () => { this.hideModal(); this.newGame(); });
        document.getElementById('modalSwitchContinueBtn').addEventListener('click', () => { this.hideModal(); });
        document.getElementById('modalSwitchEndBtn').addEventListener('click', () => {
            const fn = this.pendingSwitch;
            this.pendingSwitch = null;
            this.hideModal();
            if (fn) fn();
        });

        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const newLevel = parseInt(btn.dataset.level);
                const newLimit = UNDO_LIMITS[newLevel] || 3;
                // 已用悔棋次数超过新难度上限 → 禁止切换（防止切来切去多拿悔棋次数）
                if (this.gameMode === 'pvc' && !this.practiceMode && this.undoUsed > newLimit) {
                    this.showToast(`已悔棋 ${this.undoUsed} 次\n超过「${btn.textContent}」上限 ${newLimit} 次，无法切换`);
                    return;   // 难度与按钮高亮都保持不变
                }
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                this.difficulty = newLevel;
                // 本局上限只降不升：切到更宽松的难度也不会获得额外次数
                this.undoCap = Math.min(this.undoCap, newLimit);
                this.updateControlsState();
                this.savePrefs();
            });
        });
        // 恢复已保存难度对应的按钮高亮
        const activeDiffBtn = document.querySelector(`.difficulty-btn[data-level="${this.difficulty}"]`);
        if (activeDiffBtn) {
            document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
            activeDiffBtn.classList.add('active');
        }
        document.getElementById('newGameBtn').addEventListener('click', () => this.confirmNewGame());
        document.getElementById('undoBtn').addEventListener('click', () => this.undoMove(this.getPlayerColorValue(), true));
        document.getElementById('resignBtn').addEventListener('click', () => this.resign());
        this.stopAIBtn.addEventListener('click', () => this.toggleAI());
        // 5.2.12：复盘按钮移入对局结束弹窗（modalEndRow）
        this.modalAnalysisBtnEl = document.getElementById('modalAnalysisBtn');
        if (this.modalAnalysisBtnEl) this.modalAnalysisBtnEl.addEventListener('click', () => {
            this.hideModal();           // 关掉结束弹窗，露出棋盘
            if (this._analysisRunning) this._stopAnalysis();
            else startAnalysis(this);   // 对已结束的整局做复盘
        });
        // 5.2.5：双人模式对方侧倒置悔棋按钮（isBottom=false → toast 底部倒置）
        if (this.oppUndoBtnEl) this.oppUndoBtnEl.addEventListener('click', () => this.undoMove(this.getTopColor(), false));
        this.modalCloseEl.addEventListener('click', () => this.hideModal());
        this.modalEl.addEventListener('click', (e) => { if (e.target === this.modalEl) this.hideModal(); });
    }

    // ===================== 提示（设置里开启「需要提示」后可用） =====================
    // 用最高档搜索替玩家想一步，并在棋盘上把"起点→终点"标绿；玩家走子后自动消失。

    showHint() {
        if (this.gameOver || this.isAnimating || this._hintRunning) return;
        if (this.gameMode === 'pvc' && this.currentPlayer !== this.getPlayerColorValue()) {
            this.showToast('现在轮到对方走棋');
            return;
        }
        // 同一手已经提示过 → 直接重新高亮，不重复搜索
        if (this.hintMove && this._hintPly === this.sanHistory.length) {
            this.render();
            this.showToast('已标出建议走法');
            return;
        }
        this._hintRunning = true;
        if (this.hintBtnEl) this.hintBtnEl.classList.add('busy');
        this.showToast('正在为你思考…');
        const token = this.animationToken;
        const finish = (move) => {
            this._hintRunning = false;
            if (this.hintBtnEl) this.hintBtnEl.classList.remove('busy');
            if (token !== this.animationToken) return;   // 期间已走子/重开 → 丢弃这次结果
            if (!move) { this.showToast('暂时没有可走的着法'); return; }
            move._san = this.moveSAN(move, this.board);
            this.hintMove = move;
            this._hintPly = this.sanHistory.length;
            this.render();
            this.showToast('已标出建议走法');
        };
        // v7.5.0：提示搜索同样走 Worker（思考期间界面不卡）；Worker 不可用回退旧的同步路径
        const req = EngineWorker.findBestMoveAsync({
            board: this.board, color: this.currentPlayer, castlingRights: this.castlingRights,
            enPassantTarget: this.enPassantTarget, level: 4,
            sanHistory: this.sanHistory, repKeys: this.positionHistory,
            timeoutMs: 10000
        });
        if (req) {
            req.then(res => finish(res && res.ok ? res.move : null));
        } else {
            setTimeout(() => {
                let move = null;
                try {
                    move = ChessEngine.findBestMove(this.board, this.currentPlayer, this.castlingRights, this.enPassantTarget, 4, undefined, this.sanHistory, this.positionHistory);
                } catch (e) { move = null; }
                // v7.7.0 兜底：连提示都算不出来也别报"没有可走的着法"（那是误导），
                // 退一步给第一个合法着法当建议。
                if (!move) {
                    const legal = ChessEngine.generateMoves(this.board, this.currentPlayer, this.castlingRights, this.enPassantTarget)
                        .filter(m => !ChessEngine.isInCheck(ChessEngine.makeMove(this.board, m), this.currentPlayer));
                    move = legal.length ? legal[0] : null;
                }
                finish(move);
            }, 40);
        }
    }

    getPlayerColorValue() {
        return this.playerColor === 'b' ? ChessEngine.BLACK : ChessEngine.WHITE;
    }

    getAIColorValue() {
        return this.playerColor === 'b' ? ChessEngine.WHITE : ChessEngine.BLACK;
    }

    toggleAI() {
        if (this.practiceMode) { this.showToast('练习模式固定为人机对练'); return; }
        // 切换前先弹确认：结束当前对局（切过去新开）还是继续（留在当前模式）
        const toPvp = this.gameMode === 'pvc';
        const title = toPvp ? '切换到双人对战' : '切换回人机对战';
        const msg = toPvp
            ? '将结束当前人机对局并新开一局双人对战。'
            : '将结束当前双人对局并新开一局人机对战。';
        this.pendingSwitch = () => { this.doSwitchMode(); };
        this.showModal(title, msg, 'switch');
    }

    doSwitchMode() {
        this.animationToken++;   // 作废进行中的 AI 走子动画（与重开/悔棋/认输保持一致）
        this.isAnimating = false;
        if (this.gameMode === 'pvc') {
            this.gameMode = 'pvp';
            this.stopAI();
            this.stopAIBtn.classList.remove('danger');
            this.stopAIBtn.classList.add('primary');
            this.resignBtn.textContent = '认输';
            this.colorSliderWrapEl.style.display = 'none';   // 双人模式选色无意义，隐藏
            this.newGame();
            this.showToast('已切换到双人对战');
        } else {
            this.gameMode = 'pvc';
            this.stopAIBtn.classList.remove('primary');
            this.resignBtn.textContent = '认输';
            this.colorSliderWrapEl.style.display = '';       // 恢复滑块
            this.newGame();
            this.showToast('已切换回人机对战');
        }
    }

    // 根据对局状态禁用/启用操作按钮（游戏结束后认输不可点）
    updateControlsState() {
        if (this.resignBtn) {
            this.resignBtn.disabled = this.gameOver;
            this.resignBtn.textContent = this.practiceMode ? '放弃本题' : '认输';
        }
        // 练习模式：主按钮语义改成「重开本题」，难度行改叫「对手强度」
        if (this.newGameBtn) this.newGameBtn.textContent = this.practiceMode ? '重开本题' : '新对局';
        if (this.difficultyLabelEl) this.difficultyLabelEl.textContent = this.practiceMode ? '对手强度' : '难度';
        // 5.2.7：悔棋按钮按"当前是否还有可用的悔棋"disable（避免点开才发现没次数）
        if (this.undoBtn) {
            const noSteps = this.historyStack.length === 0;
            const mineColor = this.getPlayerColorValue();
            const mineLeft = this.gameMode === 'pvp'
                ? 3 - (mineColor === ChessEngine.WHITE ? this.undoUsedW : this.undoUsedB)
                : (this.practiceMode ? Infinity : this.undoLeft());
            // 5.2.8：双人模式下"轮到己方走"说明刚走的是对方，己方无可悔的步 → 一并禁用
            const notMyTurn = this.gameMode === 'pvp' && this.currentPlayer === mineColor;
            this.undoBtn.disabled = this.gameOver || noSteps || mineLeft <= 0 || notMyTurn;
            // v7.7.0 体验：把剩余悔棋次数直接写在按钮上。
            // 旧版要点开才知道还剩几次，练习模式次数是无限的（保持不显示数字）。
            if (this.gameMode === 'pvp') {
                this.undoBtn.textContent = '悔棋 ' + Math.max(0, Math.min(3, mineLeft));
            } else if (this.practiceMode) {
                this.undoBtn.textContent = '悔棋';
            } else {
                this.undoBtn.textContent = '悔棋 ' + Math.max(0, mineLeft);
            }
        }
        // 5.2.7：双人模式对方侧按钮同样按"对方剩余次数 + 是否有步可悔"disable
        if (this.oppUndoBtnEl) {
            const topColor = this.getTopColor();
            const topLeft = 3 - (topColor === ChessEngine.WHITE ? this.undoUsedW : this.undoUsedB);
            // 5.2.8：同上，双人模式只有刚走完棋的那一方能悔
            this.oppUndoBtnEl.disabled = this.gameOver || this.historyStack.length === 0 || topLeft <= 0
                || (this.gameMode === 'pvp' && this.currentPlayer === topColor);
        }
        if (this.stopAIBtn) {
            // 练习模式固定人机对练，不允许切成双人
            this.stopAIBtn.disabled = this.gameOver || this.practiceMode;
            this.stopAIBtn.style.opacity = this.practiceMode ? '0.45' : '';
            // 5.2.10：按钮文字显示"切换目标"——双人时显示「人机模式」、人机时显示「双人模式」。
            // 放在统一状态刷新入口，覆盖初始化/切换/读档各路径（不只在 doSwitchMode 里改）。
            if (!this.practiceMode) {
                this.stopAIBtn.textContent = (this.gameMode === 'pvp') ? '人机模式' : '双人模式';
            }
        }
        // 双人模式：隐藏难度档（提示按钮保留）；用 body 类统一驱动，覆盖初始化/切换/读档各路径
        document.body.classList.toggle('pvp', this.gameMode === 'pvp');
    }

    resign() {
        if (this.gameOver || this.playerColor === null) return;
        if (this.practiceMode) {
            this.showModal('放弃本题', '确定要放弃当前这道练习题吗？', 'confirm', () => this.practiceFinish(false, '已放弃本题，可以再来一次。'));
            return;
        }
        // 认输前二次确认，防手滑：继续（不认输）/ 确认（认输）
        this.showModal('认输', this.gameMode === 'pvp' ? '确定要认输吗？' : '确定要认输吗？（本局判负）', 'confirm', () => this.doResign(), '继续');
    }

    doResign() {
        if (this.gameOver || this.playerColor === null) return;
        this.stopAI();
        this.animationToken++;
        this.gameOver = true;
        // 赢家：双人模式是对方，人机模式是 AI
        let winner;
        if (this.gameMode === 'pvp') {
            winner = this.currentPlayer === ChessEngine.WHITE ? '黑方' : '白方';
        } else {
            winner = 'AI（' + (this.playerColor === 'w' ? '黑方' : '白方') + '）';
        }
        this.showModal('认输', `${winner}获胜！`, 'end');
        SoundManager.playGameEnd();
        this.hintMove = null;
        this.updateControlsState();
        this.render();
    }

    stopAI() {
        this._aiGen = (this._aiGen || 0) + 1;   // 让进行中的搜索/待执行回调失效
        // v7.7.0：光靠 stale() 只保证"不用旧结果"，Worker 里的搜索会照跑完整个时间预算
        // （大师档 2800ms）——悔棋 3 次白白吃掉约 8.4 秒满负荷 CPU，笔记本上直接体现为风扇转速。
        // 这里显式通知 Worker 中止，让引擎的 abortSignal 立刻生效。
        EngineWorker.terminatePending();
        if (this.aiFrame) {
            cancelAnimationFrame(this.aiFrame);
            this.aiFrame = null;
        }
        if (this.aiTimer) {
            clearTimeout(this.aiTimer);
            this.aiTimer = null;
        }
        if (this.abortController) {
            this.abortController.abort();
            this.abortController = null;
        }
        this.isThinking = false;
        this.clearAnimationElements();
        this.render();
    }

    clearAnimationElements() {
        this.boardWrapper.querySelectorAll('.animating-piece, .captured-piece-anim').forEach(el => el.remove());
    }

    saveState() {
        this.historyStack.push({
            board: JSON.parse(JSON.stringify(this.board)),
            currentPlayer: this.currentPlayer,
            capturedByWhite: [...this.capturedByWhite],
            capturedByBlack: [...this.capturedByBlack],
            castlingRights: this.castlingRights,
            enPassantTarget: this.enPassantTarget ? [...this.enPassantTarget] : null,
            lastMove: this.lastMove ? JSON.parse(JSON.stringify(this.lastMove)) : null,
            positionHistory: [...this.positionHistory],
            halfMoveClock: this.halfMoveClock
        });
    }

    getSquarePixelPos(r, c) {
        // 执黑时棋盘翻转，物理排布上下颠倒；逻辑坐标 (r,c) 映射到物理位置
        const dispR = this.getDisplayRow(r);
        const dispC = this.getDisplayCol(c);
        const rect = this.boardWrapper.getBoundingClientRect();
        const size = rect.width / 8;
        return { x: dispC * size, y: dispR * size, size };
    }

    getDisplayRow(r) {
        // 当前玩家在下方：执黑翻转，否则原样
        return this.isFlipped() ? (7 - r) : r;
    }

    // 双人模式：旋转"远离你的那一种颜色"（棋盘上方的颜色）。
    // 执白不翻转时上方是黑棋、执黑翻转后上方是白棋，所以跟随棋盘朝向而非写死黑色。
    getTopColor() {
        return this.isFlipped() ? ChessEngine.WHITE : ChessEngine.BLACK;
    }

    pieceFacingUp(piece) {
        // 双人模式：旋转上方的棋子（远离当前视角）。非 pvp 一律不旋转。
        return this.gameMode === 'pvp' && ChessEngine.getPieceColor(piece) === this.getTopColor();
    }

    getDisplayCol(c) {
        return this.isFlipped() ? (7 - c) : c;
    }

    buildBoardDOM() {
        this.boardEl.innerHTML = '';
        this._squareEls = {};
        // 按显示顺序生成格子：翻转时先放显示行 0（物理顶部）= 逻辑第 7 行
        for (let dispR=0; dispR<8; dispR++) {
            for (let dispC=0; dispC<8; dispC++) {
                const r = this.getLogicRow(dispR);
                const c = this.getLogicCol(dispC);
                const sq = document.createElement('div');
                // 棋盘格子颜色由逻辑位置决定，翻转只影响排布
                const baseClass = `square ${(r+c)%2===0 ? 'light' : 'dark'}`;
                sq.className = baseClass;
                sq.dataset.row = r;
                sq.dataset.col = c;
                const coordFile = document.createElement('span');
                coordFile.className = 'coord coord-file';
                coordFile.textContent = FILES[c];
                const coordRank = document.createElement('span');
                coordRank.className = 'coord coord-rank';
                coordRank.textContent = 8 - r;
                sq.appendChild(coordFile);
                sq.appendChild(coordRank);
                sq.addEventListener('click', () => this.onSquareClick(r, c));
                this.boardEl.appendChild(sq);
                this._squareEls[r + ',' + c] = { sq, baseClass, shownPiece: undefined };
            }
        }
        this._flippedRendered = this.isFlipped();
    }

    getLogicRow(dispR) {
        return this.isFlipped() ? (7 - dispR) : dispR;
    }

    getLogicCol(dispC) {
        return this.isFlipped() ? (7 - dispC) : dispC;
    }

    render() {
        this.clearAnimationElements();
        if (!this._squareEls) {
            this.buildBoardDOM();
        }
        const inCheckNow = ChessEngine.isInCheck(this.board, this.currentPlayer);
        const checkKing = inCheckNow ? this.currentPlayer * ChessEngine.KING : 0;
        for (let r=0; r<8; r++) {
            for (let c=0; c<8; c++) {
                const info = this._squareEls[r + ',' + c];
                const sq = info.sq;
                const piece = this.board[r][c];
                let cls = info.baseClass;
                if (this.selectedSquare && this.selectedSquare[0]===r && this.selectedSquare[1]===c) {
                    cls += ' selected';
                }
                if (this.validMoves.some(m => m.to[0]===r && m.to[1]===c)) {
                    cls += piece !== 0 ? ' valid-capture' : ' valid-move';
                }
                if (this.lastMove) {
                    if ((this.lastMove.from[0]===r && this.lastMove.from[1]===c) ||
                        (this.lastMove.to[0]===r && this.lastMove.to[1]===c)) {
                        cls += ' last-move';
                    }
                }
                if (piece === checkKing) {
                    cls += ' in-check';
                }
                sq.className = cls;
                if (info.shownPiece !== piece) {
                    info.shownPiece = piece;
                    const old = sq.querySelector('.piece-glyph');
                    if (old) old.remove();
                    if (piece !== 0) {
                        const span = document.createElement('span');
                        span.className = 'piece-glyph ' + pieceGlyphClass(piece);
                        span.style.backgroundImage = `url(${pieceImg(piece)})`;
                        span.style.zIndex = '2';
                        if (this.pieceFacingUp(piece)) {
                            span.classList.add('piece-rotated');
                        }
                        sq.appendChild(span);
                    }
                } else if (piece !== 0) {
                    const span = sq.querySelector('.piece-glyph');
                    if (span) {
                        span.style.visibility = '';
                        span.classList.toggle('piece-rotated', this.pieceFacingUp(piece));
                    }
                }
            }
        }
        this.updateStatus(inCheckNow);
        this.updateCaptured();
        this.updateMoveHistory();
        this.drawHintArrow();
    }

    // 提示箭头：在棋盘上画一条灰色细线，从起点指向终点（替代原来只报坐标）
    drawHintArrow() {
        const old = this.boardWrapper.querySelector('.hint-arrow-svg');
        if (old) old.remove();
        if (!this.hintMove || this.gameOver) return;
        const a = this.getSquarePixelPos(this.hintMove.from[0], this.hintMove.from[1]);
        const b = this.getSquarePixelPos(this.hintMove.to[0], this.hintMove.to[1]);
        const s = a.size;                    // 单格边长
        const total = s * 8;                 // 棋盘边长
        const half = s / 2;
        let x1 = a.x + half, y1 = a.y + half;
        let x2 = b.x + half, y2 = b.y + half;
        const dx = x2 - x1, dy = y2 - y1;
        const len = Math.sqrt(dx*dx + dy*dy) || 1;
        const ux = dx / len, uy = dy / len;
        const padStart = s * 0.20, padEnd = s * 0.42;   // 两端留白（终点多留，给箭头头）
        const sx = x1 + ux * padStart, sy = y1 + uy * padStart;
        const ex = x2 - ux * padEnd,   ey = y2 - uy * padEnd;
        const sw = Math.max(1.4, s * 0.055);            // 细线
        // 用 HTML 解析器插入 SVG（自动进入 SVG 命名空间），避免在源码里写入外部命名空间 URI
        this.boardWrapper.insertAdjacentHTML('beforeend',
            '<svg class="hint-arrow-svg" viewBox="0 0 ' + total + ' ' + total + '">' +
            '<defs><marker id="hintArrowHead" markerWidth="5" markerHeight="5" refX="4.4" refY="2.5" orient="auto">' +
            '<path d="M0,0 L5,2.5 L0,5 z" fill="#9ca3af"/></marker></defs>' +
            '<line x1="' + sx + '" y1="' + sy + '" x2="' + ex + '" y2="' + ey + '"' +
            ' stroke="#9ca3af" stroke-width="' + sw + '" stroke-linecap="round"' +
            ' marker-end="url(#hintArrowHead)"/></svg>');
    }

    onSquareClick(r, c) {
        if (this.gameOver || this.isThinking || this.isAnimating) return;
        if (this.gameMode === 'pvc' && this.currentPlayer !== this.getPlayerColorValue()) return;
        const piece = this.board[r][c];
        if (this.selectedSquare) {
            const move = this.validMoves.find(m => m.to[0]===r && m.to[1]===c);
            if (move) {
                if (move.promotion) {
                    this.showPromotionModal(move);
                } else {
                    this.executeMoveWithAnimation(move);
                }
                return;
            }
        }
        if (piece !== 0 && ChessEngine.getPieceColor(piece) === this.currentPlayer) {
            this.selectedSquare = [r, c];
            this.validMoves = this.getLegalMovesForPiece(r, c);
            this.render();
        } else {
            this.selectedSquare = null;
            this.validMoves = [];
            this.render();
        }
    }

    getLegalMovesForPiece(r, c) {
        const allMoves = ChessEngine.generateMoves(this.board, this.currentPlayer, this.castlingRights, this.enPassantTarget);
        return allMoves.filter(m => m.from[0]===r && m.from[1]===c)
            .filter(m => !ChessEngine.isInCheck(ChessEngine.makeMove(this.board, m), this.currentPlayer));
    }

    async executeMoveWithAnimation(move) {
        if (this.isAnimating) return;
        const token = ++this.animationToken;
        this.isAnimating = true;
        this.humanMoved = true;   // 玩家落子（人机模式下用于滑块切换判定；双人模式双方都算）
        this.selectedSquare = null;
        this.validMoves = [];
        this.render();   // 立刻清掉选中高亮与落点灰点：否则整段走子动画期间灰点还挂在棋盘上
        this.saveState();
        const piece = this.board[move.from[0]][move.from[1]];
        const isCapture = move.captured !== 0 || move.enPassant;
        this.clearAnimationElements();

        const fromPos = this.getSquarePixelPos(move.from[0], move.from[1]);
        const toPos = this.getSquarePixelPos(move.to[0], move.to[1]);

        const animPiece = document.createElement('div');
        animPiece.className = 'animating-piece';
        const glyph = document.createElement('span');
        glyph.className = pieceGlyphClass(move.promotion || piece);
        glyph.style.backgroundImage = `url(${pieceImg(move.promotion || piece)})`;
        if (this.pieceFacingUp(move.promotion || piece)) {
            glyph.classList.add('piece-rotated');
        }
        animPiece.appendChild(glyph);
        animPiece.style.left = fromPos.x + 'px';
        animPiece.style.top = fromPos.y + 'px';
        animPiece.style.width = fromPos.size + 'px';
        animPiece.style.height = fromPos.size + 'px';
        this.boardWrapper.appendChild(animPiece);

        // 走子时隐藏起点棋子字形，让棋子真正"离开"起点，避免动画期间一格两影
        const fromSquare = this.boardEl.querySelector(`[data-row="${move.from[0]}"][data-col="${move.from[1]}"]`);
        if (fromSquare) {
            const glyphEl = fromSquare.querySelector('.piece-glyph');
            if (glyphEl) glyphEl.style.visibility = 'hidden';
        }


        await new Promise(resolve => {
            // rAF 在后台标签页会被节流导致永不触发，用 setTimeout 兜底，保证动画一定能走完
            const rafId = requestAnimationFrame(resolve);
            setTimeout(() => { cancelAnimationFrame(rafId); resolve(); }, 50);
        });
        if (token !== this.animationToken) { this.isAnimating = false; this.isThinking = false; return; }
        animPiece.style.transform = `translate(${toPos.x - fromPos.x}px, ${toPos.y - fromPos.y}px)`;
        // 到达帧：被吃棋在目标格保持显示，直到吃子棋抵达这一瞬间才消失
        if (isCapture) {
            const toSquare = this.boardEl.querySelector(`[data-row="${move.to[0]}"][data-col="${move.to[1]}"]`);
            if (toSquare) {
                const toGlyph = toSquare.querySelector('.piece-glyph');
                if (toGlyph) toGlyph.style.visibility = 'hidden';
            }
        }
        await new Promise(resolve => setTimeout(resolve, 320));
        if (token !== this.animationToken) { this.isAnimating = false; this.isThinking = false; return; }

        animPiece.remove();

        if (isCapture) SoundManager.playCapture();
        else SoundManager.playMove();

        this.finalizeMove(move);
        this.isAnimating = false;
    }

    finalizeMove(move) {
        if (move.captured !== 0) {
            if (ChessEngine.getPieceColor(move.captured) === ChessEngine.WHITE) {
                this.capturedByBlack.push(move.captured);
            } else {
                this.capturedByWhite.push(move.captured);
            }
        }
        const sanPrevBoard = this.board;   // 记谱消歧义需要走子前棋盘
        this.board = ChessEngine.makeMove(this.board, move);
        this.castlingRights = ChessEngine.getCastlingRights(this.board, this.castlingRights);
        this.enPassantTarget = ChessEngine.getEnPassantTarget(this.board, move);
        this.lastMove = move;
        this.sanHistory.push(this.moveSAN(move, sanPrevBoard));
        this.currentPlayer = -this.currentPlayer;
        const moverColor = -this.currentPlayer;   // 刚落子的一方
        this.hintMove = null;                     // 走过子后提示自动失效
        this.updatePositionHistory();
        this.saveGameState();          // 每步落子后存档（关掉 App 也能接着下）
        // 练习模式：先判"是否达成目标"，再判"是否超出步数"
        if (this.practiceMode && !this.practiceDone) {
            const ex = PRACTICE_POSITIONS[this.practiceIndex];
            const playerJustMoved = moverColor === this.getPlayerColorValue();
            this.updatePracticeUI();          // 每步刷新"已用 X/Y 步"和进度条
            if (playerJustMoved && ex && ex.win === 'promote' && move.promotion) {
                this.render();
                this.practiceFinish(true, '兵已升变，胜势已定。');
                return;
            }
            if (playerJustMoved && ex && this.getPracticeUsed() > ex.limit) {
                this.render();
                this.practiceFinish(false, '超过步数上限了，再试一次。');
                return;
            }
        }
        this.render();
        // 检查王是否被吃
        this.checkKingCapture();
        if (this.checkGameEnd()) {
            if (!this.practiceMode) SoundManager.playGameEnd();   // 练习模式的音效在 practiceFinish 里播
            this.updateControlsState();   // 终局后按钮状态（新对局/认输等可点）
            return;
        }
        this.updateControlsState();       // 5.2.10：走子后刷新按钮状态。此前只在 AI 路径刷新，
                                          //   双人真人对走从不刷新 → 悔棋按钮一直卡在开局禁用态
        if (this.gameMode === 'pvc' && this.currentPlayer === this.getAIColorValue()) {
            this.aiMoveWithDelay();
        }
    }

    checkKingCapture() {
        const whiteKingExists = this.board.some(row => row.includes(ChessEngine.WHITE * ChessEngine.KING));
        const blackKingExists = this.board.some(row => row.includes(ChessEngine.BLACK * ChessEngine.KING));
        if (!whiteKingExists || !blackKingExists) {
            this.gameOver = true;
            const winner = !whiteKingExists ? '黑方' : '白方';
            this.showModal('王被吃', `${winner}获胜！`, 'end');
            SoundManager.playGameEnd();
        }
    }

    aiMoveWithDelay() {
        if (this.gameMode !== 'pvc') return;
        this.isThinking = true;
        // v7.7.0 体验：思考时显示已用秒数。大师档要 2.8s，没有计时用户会怀疑卡死。
        (() => {
            const t0 = Date.now(), gen = this._aiGen;
            if (this._thinkTimer) { clearInterval(this._thinkTimer); this._thinkTimer = null; }
            this._thinkTimer = setInterval(() => {
                if (gen !== this._aiGen || !this.isThinking) { clearInterval(this._thinkTimer); this._thinkTimer = null; return; }
                if (this.thinkingTimerEl) this.thinkingTimerEl.textContent = ((Date.now() - t0) / 1000).toFixed(1) + 's';
            }, 100);
        })();
        this.render();
        this.abortController = new AbortController();
        const ac = this.abortController;
        const aiColor = this.getAIColorValue();
        const gen = ++this._aiGen;   // 本次搜索代号：被中断（重开/悔棋/认输/切模式）后自动失效
        const stale = () => gen !== this._aiGen || ac.aborted;
        // v7.5.0：搜索移入 Web Worker，不再阻塞主线程——不再需要"先让出一帧再开搜"的
        // rAF/定时器双保险（那是为同步阻塞搜索做的 workaround），直接开搜，思考期间界面全程流畅。
        // Worker 不可用（老 WebView）时自动回退旧的同步路径（ac.signal 中断仍生效）。
        const runSearch = async () => {
            if (stale()) { this.isThinking = false; this.render(); return; }
            let move = null;
            const req = EngineWorker.findBestMoveAsync({
                board: this.board, color: aiColor, castlingRights: this.castlingRights,
                enPassantTarget: this.enPassantTarget, level: this.difficulty,
                sanHistory: this.sanHistory, repKeys: this.positionHistory,
                // v7.7.0：超时阈值（大师档预算 2800ms，给到 8s 余量）
                timeoutMs: this.difficulty === 3 ? 8000 : 4000
            });
            if (req) {
                const res = await req;   // Worker 搜索期间不卡界面；被中断则结果由 stale() 作废
                if (res && res.ok) {
                    move = res.move;
                }
            }
            // v7.7.0 三层兜底（旧版只有"Worker 坏了就同步搜"两层，且 Worker 超时后无出口）：
            //   ① Worker 正常返回 → 用它的结果
            //   ② Worker 失败/超时/不可用 → 主线程同步搜索
            //   ③ 连同步搜索都拿不到着法 → 落到第一个合法着法，绝不卡回合
            if (!move && !stale()) {
                try {
                    move = ChessEngine.findBestMove(
                        this.board, aiColor, this.castlingRights, this.enPassantTarget,
                        this.difficulty, ac.signal, this.sanHistory, this.positionHistory
                    );
                } catch (e) { move = null; }
                if (!move) {
                    const legal = ChessEngine.generateMoves(this.board, aiColor, this.castlingRights, this.enPassantTarget)
                        .filter(m => !ChessEngine.isInCheck(ChessEngine.makeMove(this.board, m), aiColor));
                    move = legal.length ? legal[0] : null;
                }
            }
            if (move && !stale()) {
                this.executeAIMove(move);
            } else {
                this.isThinking = false;
                this.render();
                this.checkGameEnd();
            }
        };
        runSearch();
    }

    async executeAIMove(move) {
        if (this.isAnimating) return;
        const token = ++this.animationToken;
        this.saveState();
        this.isAnimating = true;
        this.selectedSquare = null;
        this.validMoves = [];
        this.render();   // 立刻清掉残留的选中高亮/灰点（AI 走子期间不该还留着玩家的落点提示）
        const piece = this.board[move.from[0]][move.from[1]];
        const isCapture = move.captured !== 0 || move.enPassant;
        this.clearAnimationElements();

        const fromPos = this.getSquarePixelPos(move.from[0], move.from[1]);
        const toPos = this.getSquarePixelPos(move.to[0], move.to[1]);
        // 距离自适应：按位移格数决定动画时长，单格与玩家手动走子完全一致(0.32s)，走得越远越从容
        // （用格数而非像素，避免不同屏幕尺寸下速度漂移）
        const squares = Math.max(Math.abs(move.to[0]-move.from[0]), Math.abs(move.to[1]-move.from[1])); // 位移格数
        const animDuration = Math.max(0.32, Math.min(0.9, squares * 0.32)); // 秒：单格=0.32s(与手动相同)，每多一格累加


        const animPiece = document.createElement('div');
        animPiece.className = 'animating-piece';   // 不用 CSS transition, 改用 rAF 逐帧插值(Android WebView 对 transition 合成不可靠)
        const glyph = document.createElement('span');
        glyph.className = pieceGlyphClass(move.promotion || piece);
        glyph.style.backgroundImage = `url(${pieceImg(move.promotion || piece)})`;
        if (this.pieceFacingUp(move.promotion || piece)) {
            glyph.classList.add('piece-rotated');
        }
        animPiece.appendChild(glyph);
        // 用 vision-free 的绝对定位: left/top 由 rAF 逐帧推进, 无需 transform/transition
        animPiece.style.position = 'absolute';
        animPiece.style.willChange = 'left, top';
        const sizePx = fromPos.size + 'px';
        animPiece.style.width = sizePx;
        animPiece.style.height = sizePx;
        animPiece.style.zIndex = '60';
        this.boardWrapper.appendChild(animPiece);

        // 走子时隐藏起点棋子字形，让棋子真正"离开"起点，避免动画期间一格两影
        const fromSquare = this.boardEl.querySelector(`[data-row="${move.from[0]}"][data-col="${move.from[1]}"]`);
        if (fromSquare) {
            const glyphEl = fromSquare.querySelector('.piece-glyph');
            if (glyphEl) glyphEl.style.visibility = 'hidden';
        }

        // ---- rAF 逐帧滑动动画 (不依赖 CSS transition, 各渲染环境一致) ----
        const dx = toPos.x - fromPos.x, dy = toPos.y - fromPos.y;
        animPiece.style.left = fromPos.x + 'px';
        animPiece.style.top = fromPos.y + 'px';
        const startTime = performance.now();
        await new Promise(resolve => {
            // 后台标签页 rAF 会被节流暂停导致动画永不结束，用 setTimeout 兜底强制走完，防止 isAnimating 卡死
            let settled = false, guardTimer = null;
            const finish = () => { if (settled) return; settled = true; if (guardTimer) clearTimeout(guardTimer); resolve(); };
            let lastNow = performance.now();
            let stuckCount = 0;
            const step = (now) => {
                if (token !== this.animationToken) { finish(); return; }
                // 兜底：若 rAF 长时间不触发（后台），强制结束
                if (now - lastNow > 300) stuckCount++;
                lastNow = now;
                if (stuckCount >= 20) { finish(); return; }
                const t = Math.min(1, (now - startTime) / (animDuration * 1000));
                // 平滑缓入缓出 (easeInOutCubic)
                const e = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
                animPiece.style.left = (fromPos.x + dx * e) + 'px';
                animPiece.style.top = (fromPos.y + dy * e) + 'px';
                if (t >= 1 && isCapture) {
                    // 到达帧：吃子棋抵达目标格的这一瞬间，被吃棋子原glyph(全程显示)才消失
                    const toSquare = this.boardEl.querySelector(`[data-row="${move.to[0]}"][data-col="${move.to[1]}"]`);
                    if (toSquare) {
                        const toGlyph = toSquare.querySelector('.piece-glyph');
                        if (toGlyph) toGlyph.style.visibility = 'hidden';
                    }
                }
                if (t < 1 && !settled) {
                    requestAnimationFrame(step);
                } else {
                    finish();
                }
            };
            requestAnimationFrame(step);
            // 绝对兜底：超过 (动画时长+1s) 仍未结束就去掉 rAF 依赖，直接收尾（正常结束时由 finish 清掉）
            guardTimer = setTimeout(() => finish(), animDuration * 1000 + 1000);
        });
        // 动画期间若已重开对局/悔棋/认输(token 变化)，这一步作废 —— 否则会把着法落到新局面上（幽灵走子）
        if (token !== this.animationToken) { this.isAnimating = false; this.isThinking = false; this.clearAnimationElements(); return; }
        animPiece.remove();

        if (isCapture) SoundManager.playCapture();
        else SoundManager.playMove();

        if (move.captured !== 0) {
            if (ChessEngine.getPieceColor(move.captured) === ChessEngine.WHITE) {
                this.capturedByBlack.push(move.captured);
            } else {
                this.capturedByWhite.push(move.captured);
            }
        }
        const sanPrevBoard = this.board;   // 记谱消歧义需要走子前棋盘
        this.board = ChessEngine.makeMove(this.board, move);
        this.castlingRights = ChessEngine.getCastlingRights(this.board, this.castlingRights);
        this.enPassantTarget = ChessEngine.getEnPassantTarget(this.board, move);
        this.lastMove = move;
        this.sanHistory.push(this.moveSAN(move, sanPrevBoard));
        this.currentPlayer = this.getPlayerColorValue();
        this.updatePositionHistory();
        this.isThinking = false;
        this.isAnimating = false;
        this.render();
        this.checkKingCapture();
        if (this.checkGameEnd()) {
            SoundManager.playGameEnd();
            return;
        }
    }

    updatePositionHistory() {
        const key = ChessEngine.positionKey(this.board, this.currentPlayer, this.castlingRights, this.enPassantTarget);
        this.positionHistory.push(key);
        const lastMove = this.lastMove;
        if (lastMove.captured !== 0 || Math.abs(lastMove.piece) === ChessEngine.PAWN) {
            this.halfMoveClock = 0;
        } else {
            this.halfMoveClock++;
        }
        // v7.2.2 长将兜底：本步给对方将军 + 非吃子 + 非兵动 → 连续将军计数累加；
        //   一旦不是将军（对方脱困）或这手有实质推进（吃子/兵动），立即清零。
        //   同一方连续"光将军不推进"达到阈值即在 checkGameEnd 判和，根治 AI/玩家无限将军绕圈。
        let checkNow = false;
        try { checkNow = lastMove && ChessEngine.isInCheck(this.board, this.currentPlayer); }
        catch (e) { console.warn('[长将判和] isInCheck 探针异常，本步不计入长将计数', e); }   // v7.7.0：不再静默吞掉
        if (checkNow && lastMove.captured === 0 && Math.abs(lastMove.piece) !== ChessEngine.PAWN) {
            this.perpetualCheckCount++;
        } else {
            this.perpetualCheckCount = 0;
        }
        if (this.positionHistory.length > 200) {
            this.positionHistory = this.positionHistory.slice(-100);
        }
    }

    checkGameEnd() {
        if (this.gameOver) return true;
        const moves = ChessEngine.generateMoves(this.board, this.currentPlayer, this.castlingRights, this.enPassantTarget);
        const legalMoves = moves.filter(m => !ChessEngine.isInCheck(ChessEngine.makeMove(this.board,m), this.currentPlayer));
        if (legalMoves.length === 0) {
            this.gameOver = true;
            if (ChessEngine.isInCheck(this.board, this.currentPlayer)) {
                const winnerColorValue = -this.currentPlayer;
                if (this.practiceMode) {
                    const ok = winnerColorValue === this.getPlayerColorValue();
                    this.practiceFinish(ok, ok ? '漂亮的将杀！' : '被对方将杀了，再试一次。');
                    return true;
                }
                const winnerName = winnerColorValue === ChessEngine.WHITE ? '白方' : '黑方';
                const winner = (this.gameMode === 'pvc' && winnerColorValue === this.getAIColorValue()) ? 'AI' : winnerName;
                this.showModal('将杀！', `${winner}获胜！`, 'end');
            } else {
                if (this.practiceMode) {
                    this.practiceFinish(false, '逼和了——杀王时要给对方留一口气，让它无路可走就是和棋。');
                    return true;
                }
                this.showModal('逼和', '和棋！', 'end');
            }
            return true;
        }
        const key = ChessEngine.positionKey(this.board, this.currentPlayer, this.castlingRights, this.enPassantTarget);
        const count = this.positionHistory.filter(k => k === key).length;
        if (count >= 3) {
            this.gameOver = true;
            if (this.practiceMode) { this.practiceFinish(false, '三次重复成和——练习时要主动求变。'); return true; }
            this.showModal('三次重复', '和棋！', 'end');
            return true;
        }
        // 5.0.0 优化：添加 75 步规则（FIDE 标准：75 回合无吃子无兵动强制判和）
        if (this.halfMoveClock >= 150) {
            this.gameOver = true;
            if (this.practiceMode) { this.practiceFinish(false, '触发七十五步规则成和——推进得太慢了。'); return true; }
            this.showModal('七十五步规则', '和棋！', 'end');
            return true;
        }
        if (this.halfMoveClock >= 100) {
            this.gameOver = true;
            if (this.practiceMode) { this.practiceFinish(false, '触发五十步规则成和——推进得太慢了。'); return true; }
            this.showModal('五十步规则', '和棋！', 'end');
            return true;
        }
        // v7.2.2 长将兜底判和：同一方连续 25 手"光将军、不推进"(非吃子非兵动) → 判和。
        //   根治 AI 无限将军绕圈却迟迟不将杀（此前只能靠三次重复偶然触发，王移动时就漏判）。
        if (this.perpetualCheckCount >= 25) {
            this.gameOver = true;
            if (this.practiceMode) { this.practiceFinish(false, '长将不推进，成和——将军的同时要想着怎么终结对局。'); return true; }
            this.showModal('长将判和', '连续将军却不推进，和棋！', 'end');
            return true;
        }
        if (this.isInsufficientMaterial()) {
            this.gameOver = true;
            if (this.practiceMode) { this.practiceFinish(false, '子力不足成和——追杀的棋子被吃掉了，再试一次。'); return true; }
            this.showModal('子力不足', '和棋！', 'end');
            return true;
        }
        return false;
    }

    isInsufficientMaterial() {
        const pieces = { white: [], black: [] };
        for (let r=0; r<8; r++) for (let c=0; c<8; c++) {
            const p = this.board[r][c];
            if (p !== 0) {
                const color = ChessEngine.getPieceColor(p);
                const type = ChessEngine.getPieceType(p);
                if (color === ChessEngine.WHITE) pieces.white.push(type);
                else pieces.black.push(type);
            }
        }
        const isInsufficient = (arr) => {
            const nonKing = arr.filter(t => t !== ChessEngine.KING);
            if (nonKing.length === 0) return true;                       // 仅王
            if (nonKing.length === 1) {                                  // 王+单马 / 王+单象
                return nonKing[0] === ChessEngine.KNIGHT || nonKing[0] === ChessEngine.BISHOP;
            }
            // 王+双马：无法强制将杀（对手不配合即为和棋），按子力不足判和
            if (nonKing.length === 2 && nonKing.every(t => t === ChessEngine.KNIGHT)) return true;
            return false;
        };
        return isInsufficient(pieces.white) && isInsufficient(pieces.black);
    }

    showPromotionModal(move) {
        this.pendingPromotionMove = move;
        this.promotionPiecesEl.innerHTML = '';
        const promoColor = this.currentPlayer;
        [ChessEngine.QUEEN, ChessEngine.ROOK, ChessEngine.BISHOP, ChessEngine.KNIGHT].forEach(p => {
            const el = document.createElement('span');
            el.className = 'promotion-piece ' + pieceGlyphClass(promoColor * p);
            el.style.backgroundImage = `url(${pieceImg(promoColor * p)})`;
            el.addEventListener('click', () => {
                move.promotion = promoColor * p;
                this.hideModal();
                this.executeMoveWithAnimation(move);
            });
            this.promotionPiecesEl.appendChild(el);
        });
        this.modalTitleEl.textContent = '兵升变';
        this.modalMessageEl.textContent = '请选择升变棋子';
        this.modalCloseEl.style.display = 'none';
        // 升变不是结束，也不需确认：确保不残留上次弹窗的按钮行
        this.modalConfirmRowEl.classList.remove('show');
        this.modalEndRowEl.classList.remove('show');
        this.pendingConfirm = null;
        // 双人模式：升变方是棋盘上方那方（对方）时，整个升变弹窗翻转 180° 给对面玩家看正（与悔棋按钮同侧规则）
        const promoCard = this.modalEl.querySelector('.modal');
        const flipPromo = this.gameMode === 'pvp' && promoColor === this.getTopColor();
        if (promoCard) promoCard.classList.toggle('promo-flip', flipPromo);
        this.modalEl.classList.add('show');
    }

    // mode: 'plain'(仅确定) | 'confirm'(取消/确认) | 'end'(看看棋盘/再来一局)
    showModal(title, message, mode = 'plain', confirmFn = null, cancelText = '取消') {
        if (mode === 'end') this.clearSavedGame();   // 对局已结束，不再保留续下存档
        this.modalTitleEl.textContent = title;
        this.modalMessageEl.textContent = message;
        this.promotionPiecesEl.innerHTML = '';
        this.pendingConfirm = confirmFn;
        const promoCardG = this.modalEl.querySelector('.modal');
        if (promoCardG) promoCardG.classList.remove('promo-flip');
        this.modalCloseEl.style.display = mode === 'plain' ? 'inline-block' : 'none';
        this.modalConfirmRowEl.classList.toggle('show', mode === 'confirm');
        // 确认弹窗的「取消」按钮文案可参数化（认输/新对局用「继续」）
        const cancelBtn = document.getElementById('modalCancelBtn');
        if (cancelBtn) cancelBtn.textContent = cancelText;
        this.modalEndRowEl.classList.toggle('show', mode === 'end');
        if (this.modalPracticeRowEl) this.modalPracticeRowEl.classList.toggle('show', mode === 'practice');
        if (this.modalSwitchRowEl) this.modalSwitchRowEl.classList.toggle('show', mode === 'switch');
        // 练习模式结算：结果容器由 showPracticeResult 填充；其它模式隐藏它
        if (this.modalPracticeResultEl && mode !== 'practice') {
            this.modalPracticeResultEl.classList.remove('show');
            this.modalPracticeResultEl.innerHTML = '';
            this.modalEl.classList.remove('practice-ok', 'practice-fail');
        }
        this.modalEl.classList.add('show');
    }

    hideModal() {
        this.modalEl.classList.remove('show');
        const promoCard = this.modalEl.querySelector('.modal');
        if (promoCard) promoCard.classList.remove('promo-flip');
        this.pendingConfirm = null;
    }

    // 5.2.7：轻提示气泡。flip=true → 底部倒置（给棋盘上方玩家看）；duration 可定制（复盘评价用 4s）
    showToast(text, flip = false, duration = 2200) {
        if (!this.toastEl) return;
        this.toastEl.textContent = text;
        this.toastEl.classList.toggle('toast-flip', flip);
        // 5.2.9：双人模式把提示贴到棋盘边上（各贴自己那一侧），避免压住底部操作区
        if (this.gameMode === 'pvp' && this.boardWrapper) {
            const br = this.boardWrapper.getBoundingClientRect();
            this.toastEl.style.top = flip
                ? Math.max(8, Math.round(br.top) - 52) + 'px'      // 对方侧：棋盘上方，倒置
                : Math.round(br.bottom) + 10 + 'px';               // 己方侧：棋盘下方，正向
            this.toastEl.style.bottom = 'auto';
        } else {
            this.toastEl.style.top = '';
            this.toastEl.style.bottom = '';
        }
        this.toastEl.classList.add('show');
        if (this._toastTimer) clearTimeout(this._toastTimer);
        this._toastTimer = setTimeout(() => {
            this.toastEl.classList.remove('show');
            this.toastEl.classList.remove('toast-flip');
        }, duration);
    }

    updateStatus(inCheck = false) {
        if (this.gameOver) {
            this.thinkingIndicator.classList.remove('show');
            this.statusBarEl.classList.remove('check-alert');
            return;
        }
        // 将军提示：状态栏变红 + 棋盘四周氛围灯红框，播放音效（避免重复播放）
        (this.boardFrameEl || (this.boardFrameEl = document.querySelector('.board-frame'))).classList.toggle('checking', inCheck);
        if (inCheck) {
            this.statusBarEl.classList.add('check-alert');
            if (!this._checkSoundPlayed) {
                SoundManager.playCheck();
                this._checkSoundPlayed = true;
            }
        } else {
            this.statusBarEl.classList.remove('check-alert');
            this._checkSoundPlayed = false;
        }
        let turnName;
        if (this.gameMode === 'pvc') {
            turnName = this.currentPlayer === this.getPlayerColorValue() ? '您' : 'AI';
        } else {
            turnName = this.currentPlayer === ChessEngine.WHITE ? '白方' : '黑方';
        }
        this.statusTextEl.textContent = inCheck ? `${turnName}被将军！` : `轮到${turnName}走棋`;
        this.turnIndicator.className = `turn-indicator ${this.currentPlayer === ChessEngine.WHITE ? 'white' : 'black'}`;
        const evalScore = ChessEngine.evaluate(this.board);
        // evaluate 返回白方视角（正=白优）。记分牌要显示"己方"（执棋方）胜率：
        // 执白乘 +1，执黑乘 -1（相反数），即显示黑方视角。pvp 双人模式显示白方视角。
        const myView = this.gameMode === 'pvc' ? this.getPlayerColorValue() : ChessEngine.WHITE;
        const myEval = evalScore * myView;
        const myStr = (myEval > 0 ? '+' : '') + (myEval/100).toFixed(1);
        const colorName = (this.gameMode === 'pvc' && this.playerColor === 'b') ? '黑方' : '白方';
        this.evalScoreEl.textContent = `${colorName}优势：${myStr}`;
        if (this.isThinking) {
            this.thinkingIndicator.classList.add('show');
            // AI 思考时隐藏优势分，避免状态栏右侧同时出现两个元素在窄屏换行、把棋盘顶下去
            this.evalScoreEl.style.display = 'none';
        } else {
            this.thinkingIndicator.classList.remove('show');
            this.evalScoreEl.style.display = '';
        }
    }

    updateCaptured() {
        const fmt = arr => arr.map(p => `<span class="captured-piece" style="background-image:url('${pieceImg(p)}')"></span>`).join('');
        // 战果归属要跟随棋盘朝向：玩家自己的战果始终显示在玩家那一侧（下方）。
        // 执白时玩家在下方 → 下方=capturedByWhite；执黑翻转后 → 下方=capturedByBlack。
        const topArr = this.isFlipped() ? this.capturedByWhite : this.capturedByBlack;
        const bottomArr = this.isFlipped() ? this.capturedByBlack : this.capturedByWhite;
        const topHtml = fmt(topArr);
        const bottomHtml = fmt(bottomArr);
        if (this._capTopHtml !== topHtml) { this._capTopHtml = topHtml; this.capturedByBlackEl.innerHTML = topHtml; }
        if (this._capBottomHtml !== bottomHtml) { this._capBottomHtml = bottomHtml; this.capturedByWhiteEl.innerHTML = bottomHtml; }
    }


    updateMoveHistory() {
        // 5.2.8：只有「复盘完成、记录可点看评价」时才给可点击的视觉反馈（手型/hover）
        if (this.moveListEl) this.moveListEl.classList.toggle('analyzable',
            !!(this._analysisResults && this._analysisResults.length));
        let html = '';
        const last = this.sanHistory.length - 1;
        for (let i=0; i<this.sanHistory.length; i+=2) {
            const num = Math.floor(i/2)+1;
            const w = this.sanHistory[i] || '';
            const b = this.sanHistory[i+1] || '';
            const isLast = (i === last || i+1 === last);
            html += `<span class="move-entry${isLast ? ' cur' : ''}">${num}.`;
            // 5.2.7：每手带 data-ply → 点击事件可定位到具体某一手
            if (w) html += `<span class="ply" data-ply="${i}">${w}</span>`;
            if (b) html += `<span class="ply" data-ply="${i+1}">${b}</span>`;
            html += `</span>`;
        }
        // 7.2.2：复盘完成后，走棋记录按评价上色（疑=琥珀、误=淡红）
        if (this._analysisResults && this._analysisResults.length) {
            for (const r of this._analysisResults) {
                if (r.grade === 'good') continue;
                const tag = r.grade === 'q' ? 'grade-q' : 'grade-bad';
                html = html.replace(`class="ply" data-ply="${r.ply}">`, `class="ply ${tag}" data-ply="${r.ply}">`);
            }
        }
        if (this._moveListHtml !== html) {
            this._moveListHtml = html;
            this.moveListEl.innerHTML = html;
            this.moveListEl.scrollTop = this.moveListEl.scrollHeight;
        }
    }

    // v7.7.0 体验：键盘快捷键（桌面/外接键盘）
    //   ← →  在走棋记录里前后翻阅（配合复盘）
    //   Ctrl/Cmd+Z  悔棋      N  新对局      H  提示      Esc  关闭弹窗
    bindKeyboardShortcuts() {
        document.addEventListener('keydown', (e) => {
            if (e.defaultPrevented) return;
            const tag = (e.target && e.target.tagName) || '';
            if (tag === 'INPUT' || tag === 'TEXTAREA') return;
            const k = e.key;
            if (k === 'Escape') {
                if (this.modalEl && this.modalEl.classList.contains('show')) { this.pendingConfirm = null; this.hideModal(); }
                else if (this.settingsOverlayEl && this.settingsOverlayEl.classList.contains('show')) this.closeSettings();
                else if (this.practicePickerEl && this.practicePickerEl.classList.contains('show')) this.closePracticePicker();
                return;
            }
            // ← →：翻阅走棋记录（有复盘结果时同步显示该步评价）
            if ((k === 'ArrowLeft' || k === 'ArrowRight') && this.sanHistory.length) {
                if (!(this._analysisResults && this._analysisResults.length)) return;
                e.preventDefault();
                if (this._kbPly === undefined || this._kbPly === null) this._kbPly = this.sanHistory.length - 1;
                this._kbPly += (k === 'ArrowRight' ? 1 : -1);
                this._kbPly = Math.max(0, Math.min(this.sanHistory.length - 1, this._kbPly));
                this._showAnalysisForPly(this._kbPly);
                return;
            }
            if ((e.ctrlKey || e.metaKey) && (k === 'z' || k === 'Z')) {
                if (this.undoBtn && !this.undoBtn.disabled) { e.preventDefault(); this.undoBtn.click(); }
                return;
            }
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            if (k === 'n' || k === 'N') { if (this.newGameBtn) this.newGameBtn.click(); }
            else if (k === 'h' || k === 'H') { if (this.hintBtnEl && this.hintBtnEl.style.display !== 'none') this.hintBtnEl.click(); }
        });
    }

    moveSAN(move, prevBoard) {
        if (!move) return '';
        // 将军/将杀后缀先算出来：易位也可能造成将军(O-O+)，不能提前 return 把它漏掉
        let suffix = '';
        try {
            const oppColor = -this.currentPlayer;
            if (ChessEngine.isInCheck(this.board, oppColor)) {
                const oppLegal = ChessEngine.generateMoves(this.board, oppColor, this.castlingRights, this.enPassantTarget)
                    .filter(m => !ChessEngine.isInCheck(ChessEngine.makeMove(this.board, m), oppColor));
                suffix = oppLegal.length === 0 ? '#' : '+';
            }
        } catch (e) { /* 不因记谱问题中断走子 */ }
        if (move.castling === 'K') return 'O-O' + suffix;
        if (move.castling === 'Q') return 'O-O-O' + suffix;
        const type = Math.abs(move.piece);
        const toFile = FILES[move.to[1]];
        const toRank = 8 - move.to[0];
        let sym = '';
        if (type === ChessEngine.KNIGHT) sym='N';
        else if (type === ChessEngine.BISHOP) sym='B';
        else if (type === ChessEngine.ROOK) sym='R';
        else if (type === ChessEngine.QUEEN) sym='Q';
        else if (type === ChessEngine.KING) sym='K';
        const isCapture = move.enPassant || (move.captured !== 0 && move.captured !== undefined);
        const cap = isCapture ? (type === ChessEngine.PAWN ? FILES[move.from[1]] : '') + 'x' : '';
        const promoSuffix = move.promotion ? '=' + {2:'N',3:'B',4:'R',5:'Q'}[Math.abs(move.promotion)] : '';

        // 消歧义：若存在另一枚同色同型子也能走到目标格，按标准SAN标注来源列/行
        let disambig = '';
        if (type !== ChessEngine.PAWN && type !== ChessEngine.KING && prevBoard) {
            const myColor = ChessEngine.getPieceColor(move.piece);
            const rivals = ChessEngine.generateMoves(prevBoard, myColor, this.castlingRights || 'KQkq', this.enPassantTarget || null)
                .filter(m => !(m.from[0]===move.from[0] && m.from[1]===move.from[1]))
                .filter(m => Math.abs(m.piece) === type)   // 只考虑同类型棋子竞争目标格
                .filter(m => m.to[0]===move.to[0] && m.to[1]===move.to[1]);
            if (rivals.length > 0) {
                const sameFile = rivals.some(m => m.from[1]===move.from[1]);
                const sameRank = rivals.some(m => m.from[0]===move.from[0]);
                if (!sameFile) disambig = FILES[move.from[1]];
                else if (!sameRank) disambig = String(8-move.from[0]);
                else disambig = `${FILES[move.from[1]]}${8-move.from[0]}`;
            }
        }

        // 后缀(suffix)已在函数开头算好（易位分支也要用）
        return `${sym}${disambig}${cap}${toFile}${toRank}${promoSuffix}${suffix}`;
    }

    // ===================== 练习模式 =====================
    // 玩家已走的手数（按记谱长度和执色推算，悔棋/回溯后自动正确）
    getPracticeUsed() {
        const idx = this.getPlayerColorValue() === ChessEngine.WHITE ? 0 : 1;
        let n = 0;
        for (let i = idx; i < this.sanHistory.length; i += 2) n++;
        return n;
    }

    startPractice(index) {
        const n = PRACTICE_POSITIONS.length;
        this.practiceIndex = ((index % n) + n) % n;
        const ex = PRACTICE_POSITIONS[this.practiceIndex];
        this.undoUsed = 0;
        this.animationToken++;
        // 5.2.7：开新题清空复盘结果（旧评价对应旧走法，必须清除）
        if (this._analysisRunning) this._stopAnalysis();
        this._analysisResults = null;
        this._updateAnalysisBtn();
        this.stopAI();
        // 按题目摆子（棋盘坐标：行 0 = 第8横线，列 0 = a 线）
        const map = { K:ChessEngine.KING, Q:ChessEngine.QUEEN, R:ChessEngine.ROOK, B:ChessEngine.BISHOP, N:ChessEngine.KNIGHT, P:ChessEngine.PAWN };
        const b = Array(8).fill().map(() => Array(8).fill(0));
        for (const [ch, r, c] of ex.pieces) {
            const up = String(ch).toUpperCase();
            if (map[up] === undefined) continue;
            b[r][c] = (String(ch) === up) ? map[up] : -map[up];
        }
        this.board = b;
        ChessEngine.invalidateKingCache();  // 5.0.0：练习题摆子后重置王位缓存
        this.playerColor = ex.player;
        delete this._squareEls;               // 朝向由题目决定，重建格子
        this.currentPlayer = (ex.player === 'w') ? ChessEngine.WHITE : ChessEngine.BLACK;
        this.castlingRights = '';
        this.enPassantTarget = null;
        this.selectedSquare = null;
        this.validMoves = [];
        this.historyStack = [];
        this.sanHistory = [];
        this.capturedByWhite = [];
        this.capturedByBlack = [];
        this.lastMove = null;
        this.gameOver = false;
        this.isThinking = false;
        this.isAnimating = false;
        this._checkSoundPlayed = false;
        this.humanMoved = false;
        this.hintMove = null;
        this.practiceDone = false;
        this.halfMoveClock = 0;
        this.positionHistory = [ChessEngine.positionKey(this.board, this.currentPlayer, '', null)];
        this.gameMode = 'pvc';
        this.clearSavedGame();
        this.updateColorSliderUI();
        this.updateControlsState();
        this.updatePracticeUI();
        this.render();
        this.hideModal();
        if (this.currentPlayer === this.getAIColorValue()) this.aiMoveWithDelay();
    }

    updatePracticeUI() {
        if (!this.practiceBarEl) return;
        const ex = PRACTICE_POSITIONS[this.practiceIndex];
        if (!ex) return;
        const used = this.getPracticeUsed();
        const inGroup = PRACTICE_POSITIONS.slice(0, this.practiceIndex + 1).filter(e => e.group === ex.group).length;
        const groupTotal = PRACTICE_POSITIONS.filter(e => e.group === ex.group).length;
        const total = PRACTICE_POSITIONS.length;
        this.practiceNameEl.textContent = `${ex.name}（你执${ex.player === 'w' ? '白' : '黑'}）`;
        this.practiceProgressEl.textContent = `已用 ${used} / ${ex.limit} 步`;
        if (this.practiceMetaEl) this.practiceMetaEl.textContent = `${ex.group} ${inGroup}/${groupTotal} · 全库第 ${this.practiceIndex + 1}/${total} 题`;
        this.practiceGoalEl.textContent = ex.goal;
        if (this.practiceFillEl) {
            const pct = Math.min(100, Math.round(used / ex.limit * 100));
            this.practiceFillEl.style.width = pct + '%';
