            this.practiceFillEl.classList.toggle('warn', used >= ex.limit - 2);
        }
    }

    // 选题列表（题多了只靠"下一题"翻太累）
    openPracticePicker() {
        this.buildPracticePicker();
        if (this.practicePickerEl) this.practicePickerEl.classList.add('show');
    }
    closePracticePicker() {
        if (this.practicePickerEl) this.practicePickerEl.classList.remove('show');
    }
    buildPracticePicker() {
        if (!this.practicePickerListEl) return;
        const tag = (ex) => {
            if (ex.win === 'promote') return `升变 · ${ex.limit} 步内`;
            if (ex.limit <= 3) return `${ex.limit} 步杀`;     // 一步杀 / 两步杀 / 三步杀
            return `将杀 · ${ex.limit} 步内`;
        };
        let html = '', lastGroup = null;
        PRACTICE_POSITIONS.forEach((ex, i) => {
            if (ex.group !== lastGroup) { lastGroup = ex.group; html += `<div class="picker-group">${ex.group}</div>`; }
            html += `<button class="picker-item${i === this.practiceIndex ? ' cur' : ''}" data-idx="${i}">`
                  + `<span class="picker-no">${i + 1}</span>`
                  + `<span class="picker-name">${ex.name}</span>`
                  + `<span class="picker-tag">${tag(ex)}</span></button>`;
        });
        this.practicePickerListEl.innerHTML = html;
        if (this.practicePickerSubEl) this.practicePickerSubEl.textContent = `共 ${PRACTICE_POSITIONS.length} 题`;
        // 滚动到当前题
        const cur = this.practicePickerListEl.querySelector('.picker-item.cur');
        if (cur) this.practicePickerListEl.scrollTop = Math.max(0, cur.offsetTop - 60);
    }

    // 练习结算：把结果拆成两段渲染（上段=用时数据，下段=评语），避免长句被宽度挤成乱断行
    showPracticeResult(success, ex, used, detail) {
        this.showModal(success ? '完成！' : '未完成', '', 'practice');
        this.modalEl.classList.toggle('practice-ok', !!success);
        this.modalEl.classList.toggle('practice-fail', !success);
        const el = this.modalPracticeResultEl;
        if (!el) return;
        el.innerHTML =
            '<div class="pr-name">「' + ex.name + '」</div>' +
            '<div class="pr-steps"><span class="pr-num">' + used + '</span><span class="pr-unit">步</span>' +
            '<span class="pr-limit">上限 ' + ex.limit + ' 步</span></div>' +
            (detail ? '<div class="pr-note">' + detail + '</div>' : '');
        el.classList.toggle('fail', !success);
        el.classList.add('show');
    }

    // 完成/失败统一入口：锁住棋盘 + 弹窗给出重试/下一题
    practiceFinish(success, detail) {
        if (this.practiceDone) return;
        this.practiceDone = true;
        this.gameOver = true;
        this.isThinking = false;
        this.stopAI();
        this.hintMove = null;
        this.clearSavedGame();
        this.updatePracticeUI();
        this.updateControlsState();
        SoundManager.playGameEnd();
        const ex = PRACTICE_POSITIONS[this.practiceIndex];
        const used = this.getPracticeUsed();
        this.showPracticeResult(success, ex, used, detail || '');
    }

    // 需求3：主界面「新对局」按钮带确认弹窗（继续=取消不重开/确认=重开），防手滑丢进度
    confirmNewGame() {
        if (this.practiceMode) { this.newGame(); return; }   // 练习模式走自己的重开逻辑，不重复确认
        this.showModal('新对局', '确定要开始一局新对局吗？当前对局进度将被清除。', 'confirm', () => this.newGame(), '继续');
    }

    newGame() {
        if (this.practiceMode) { this.startPractice(this.practiceIndex); return; }
        // 5.2.7：新对局清空复盘结果（旧评价对应旧走法，必须清除）
        if (this._analysisRunning) this._stopAnalysis();
        this._analysisResults = null;
        this._updateAnalysisBtn();
        this.undoUsed = 0;        // 新对局重置悔棋次数
        this.undoCap = this.gameMode === 'pvp' ? 3 : (UNDO_LIMITS[this.difficulty] || 3);   // 新对局重置本局上限
        this.undoUsedW = 0;       // 双人模式各自悔棋次数也清零
        this.undoUsedB = 0;       // 双人模式各自悔棋次数也清零
        this.animationToken++;
        this.stopAI();
        // 每局新对局都重新决定执子色：滑块为「随机」时此处重摇一次
        const prevPlayerColor = this.playerColor;
        this.playerColor = this.resolveColor();
        // 执子色变了（白↔黑）→ 棋盘朝向要翻转，必须重建格子 DOM；
        // 否则 render() 会沿用旧朝向的 _squareEls，看起来"翻白翻黑一个样"
        if (this.playerColor !== prevPlayerColor) {
            delete this._squareEls;
        }
        this.updateColorSliderUI();
        this.board = ChessEngine.createInitialBoard();
        ChessEngine.invalidateKingCache();  // 5.0.0：新对局重置王位缓存
        this.currentPlayer = ChessEngine.WHITE;
        this.selectedSquare = null;
        this.validMoves = [];
        this.historyStack = [];
        this.sanHistory = [];
        this.capturedByWhite = [];
        this.capturedByBlack = [];
        this.castlingRights = 'KQkq';
        this.enPassantTarget = null;
        this.gameOver = false;
        this.isThinking = false;
        this.isAnimating = false;
        this.lastMove = null;
        this.hintMove = null;
        // 初始局面也要计入三次重复计数（否则回到开局局面时少算一次，判和会偏晚）
        this.positionHistory = [ChessEngine.positionKey(this.board, ChessEngine.WHITE, this.castlingRights, this.enPassantTarget)];
        this.halfMoveClock = 0;
        this.perpetualCheckCount = 0;   // v7.2.2: 新对局长将计数清零
        this._checkSoundPlayed = false;
        this.humanMoved = false;   // 玩家本局是否已落子（决定滑块切换能否立即生效）
        this.clearSavedGame();     // 新对局覆盖旧存档
        this.updateControlsState();
        this.render();
        this.hideModal();
        // 执黑时白方AI先手，开局即轮到AI则自动走棋；执白时轮到玩家不触发
        if (this.gameMode === 'pvc' && this.currentPlayer === this.getAIColorValue()) {
            this.aiMoveWithDelay();
        }
    }

    // 本局悔棋上限（按当前难度）
    undoLimit() {
        if (this.gameMode === 'pvp') return 3;
        // 本局有效上限：只降不升（切到更宽松难度不会白拿次数）
        const cap = (Number.isFinite(this.undoCap) && this.undoCap > 0) ? this.undoCap : (UNDO_LIMITS[this.difficulty] || 3);
        return cap;
    }
    undoLeft() {
        if (this.gameMode === 'pvp') {
            const used = this.currentPlayer === ChessEngine.WHITE ? this.undoUsedW : this.undoUsedB;
            return Math.max(0, 3 - used);
        }
        return Math.max(0, this.undoLimit() - this.undoUsed);
    }

    // ===================== 5.1.0 复盘分析 =====================
    _updateAnalysisBtn() {
        // 5.2.12：复盘按钮已移入结束弹窗；分析运行中此按钮不可见（弹窗已关），保持逻辑无害
        if (!this.modalAnalysisBtnEl) return;
        if (this._analysisRunning) { this.modalAnalysisBtnEl.textContent = '停止'; this.modalAnalysisBtnEl.classList.add('danger'); }
        else { this.modalAnalysisBtnEl.textContent = '复盘'; this.modalAnalysisBtnEl.classList.remove('danger'); }
    }

    _stopAnalysis() {
        this._analysisRunning = false;
        // v7.6.0：清理挂起的复盘续跑定时器（Worker 异步路径可能正等一个 setTimeout 续跑）
        if (this._analysisTimer) { clearTimeout(this._analysisTimer); this._analysisTimer = null; }
        this._updateAnalysisBtn();
        this.render();
    }

    _finishAnalysis() {
        this._analysisRunning = false;
        this._updateAnalysisBtn();
        this.render();
        if (typeof this.updateMoveHistory === 'function') this.updateMoveHistory();
        // 7.2.2：复盘完成自动展开走棋记录——用户复盘就是要逐手看，展开省一步点击
        if (this.moveHistoryEl && this.moveHistoryEl.classList.contains('collapsed')) {
            this.moveHistoryEl.classList.remove('collapsed');
        }
        const r = this._analysisResults || [];
        const good = r.filter(x=>x.grade==='good').length;
        const q = r.filter(x=>x.grade==='q').length;
        const bad = r.filter(x=>x.grade==='bad').length;
        this.showModal('复盘分析完成',
                    `共 ${r.length} 步复盘结果：\n✅ 好棋 ${good}\n⚠️ 疑问手 ${q}\n❌ 失误 ${bad}\n\n点击走棋记录查看每步详情`, 'plain');
    }

    // 点走棋记录时：如果分析完成，显示该步评价
    _showAnalysisForPly(ply) {
        if (!this._analysisResults || !this._analysisResults.length) return;
        // 5.2.8：按 ply 字段查找，不再依赖数组下标（防某步缺失时整体错位）
        const r = this._analysisResults.find(x => x.ply === ply);
        if (!r) return;
        const icon = r.grade==='good'?'✅':r.grade==='q'?'⚠️':'❌';
        const label = r.grade==='good'?'好棋':r.grade==='q'?'疑问手':'失误';
        const best = r.best ? ` · 建议：${r.best}` : '';
        // 7.2.2：复查时在棋盘上高亮该步落子（起点/终点）
        if (this._reviewHlEls) {
            this._reviewHlEls.forEach(el => { if (el) el.classList.remove('review-from', 'review-to'); });
            this._reviewHlEls = null;
        }
        if (r.fromM && r.toM) {
            const fs = this.boardEl.querySelector(`[data-row="${r.fromM[0]}"][data-col="${r.fromM[1]}"]`);
            const ts = this.boardEl.querySelector(`[data-row="${r.toM[0]}"][data-col="${r.toM[1]}"]`);
            if (fs) fs.classList.add('review-from');
            if (ts) ts.classList.add('review-to');
            this._reviewHlEls = [fs, ts];
        }
        // 5.2.13：评价分行显示——第一行着法+结论，第二行偏差+建议
        //   （.toast 已设 white-space:pre-line，文案里 \n 即真实换行）
        this.showToast(`${icon} ${r.san} → ${label}\n偏差 ${r.dev}${best}`, false, 4000);
    }

    // 5.2.3：byColor 指定"谁在悔棋"。
    // 双人模式下每个按钮只能悔自己刚走的那步：
    //   底部按钮传 getPlayerColorValue()，只有 currentPlayer===己方 时才能悔
    //   顶部按钮传 getTopColor()，只有 currentPlayer===对方 时才能悔
    // pvc 模式不传参，用 currentPlayer 推断。
    // isBottom: true=底部按钮（己方），false=顶部倒置按钮（对方），undefined=pvc
    undoMove(byColor, isBottom) {
        if (this.gameOver) {
            this.showToast('对局已结束，请点“新对局”重开');
            return;
        }
        if (this.historyStack.length === 0 || this.isAnimating) return;
        // 5.2.3 修复：双人模式下校验"谁刚走棋"，防止替对方悔棋
        if (this.gameMode === 'pvp' && byColor !== undefined) {
            if (this.currentPlayer === byColor) {
                // byColor 还没走棋（轮到 byColor 走），不能悔
                // 5.2.7：提示永远对"点按钮的那个人"正向可读；位置在对侧
                //   isBottom=true （己方按钮）→ 顶部正向 → flip=false
                //   isBottom=false（对方按钮）→ 底部倒置 → flip=true
                this.showToast('您还没走棋，无法悔棋', !isBottom);
                return;
            }
        }
        // 确定悔棋者：优先用按钮传入的 byColor，否则用 currentPlayer 推断
        const undoByColor = (byColor !== undefined && byColor !== null) ? byColor : this.currentPlayer;
        // 需求2：执黑时 AI(白) 第一步刚落完、玩家还没走 —— 无玩家自己的步可悔，禁止（也不吞次数）
        if (this.gameMode === 'pvc' && this.playerColor === 'b') {
            if (this.sanHistory.length <= 1) {
                this.showToast('你还没走棋，无法悔棋');
                return;
            }
        }
        // 悔棋次数闸门：人机模式难度越高可用越少，双人模式每人固定 3 次；练习模式不限次
        if (!this.practiceMode) {
            if (this.gameMode === 'pvp') {
                const undoByUsed = undoByColor === ChessEngine.WHITE ? this.undoUsedW : this.undoUsedB;
                if (3 - undoByUsed <= 0) {
                    // 5.2.7：位置/方向跟随"点按钮的人"
                    this.showToast('悔棋次数已用完（上限 3 次）', !isBottom);
                    return;
                }
            } else if (this.undoLeft() <= 0) {
                this.showToast(`本局悔棋次数已用完（上限 ${this.undoLimit()} 次）`);
                return;
            }
        }
        if (this.isThinking) {
            this.stopAI();
        }
        this.animationToken++;
        let pops = 1;
        if (this.gameMode === 'pvc' && this.currentPlayer === this.getPlayerColorValue() && this.historyStack.length >= 2) {
            pops = 2;
        }
        let target = null;
        for (let i = 0; i < pops; i++) {
            target = this.historyStack.pop();
            if (this.sanHistory.length > 0) this.sanHistory.pop();
        }
        if (!target) return;
        this.board = target.board;
        ChessEngine.invalidateKingCache();  // 5.0.0：悔棋后重置王位缓存
        this.currentPlayer = target.currentPlayer;
        const undoBy = undoByColor;   // 5.1.0：悔棋者由按钮调用方指定，不再从 currentPlayer 推断
        this.capturedByWhite = target.capturedByWhite;
        this.capturedByBlack = target.capturedByBlack;
        this.castlingRights = target.castlingRights;
        this.enPassantTarget = target.enPassantTarget;
        this.lastMove = target.lastMove;
        this.positionHistory = target.positionHistory;
        this.halfMoveClock = target.halfMoveClock;
        this.gameOver = false;
        this.selectedSquare = null;
        this.validMoves = [];
        this.isThinking = false;
        this.isAnimating = false;
        this._checkSoundPlayed = false;
        this.hintMove = null;
        this._analysisResults = null;   // 5.2.7：局面已变，清空复盘结果
        this.render();
        if (this.practiceMode) this.updatePracticeUI();   // 练习模式：已用步数跟着回退
        // 悔棋计数 + 悬浮提示（练习模式不限次，只给一句反馈）
        if (!this.practiceMode) {
            if (this.gameMode === 'pvp') {
                // 双人：每人固定 3 次，按「悔棋时轮到谁」记账
                if (undoBy === ChessEngine.WHITE) this.undoUsedW++; else this.undoUsedB++;
                const left = Math.max(0, 3 - (undoBy === ChessEngine.WHITE ? this.undoUsedW : this.undoUsedB));
                // 5.2.7：己方悔棋 → 顶部正向（提示给下方玩家看）
                //        对方悔棋 → 底部倒置（提示给上方玩家看）
                this.showToast(left > 0
                    ? `已悔棋，还剩 ${left} 次`
                    : '已悔棋，次数用完', !isBottom);
            } else {
                this.undoUsed++;
                this.showToast(this.undoLeft() > 0
                    ? `已悔棋，本局还剩 ${this.undoLeft()} 次`
                    : '已悔棋，本局次数已用完');
            }
        } else {
            this.showToast('已悔棋（练习模式不限次数）');
        }
        this.updateControlsState();
        this.saveGameState();      // 悔棋后的局面也要覆盖存档，避免重开 App 又回到"被悔掉"的局面
        if (this.gameMode === 'pvc' && this.currentPlayer === this.getAIColorValue() && !this.gameOver) {
            this.aiMoveWithDelay();
        }
    }
}

// ===================== 5.1.0 复盘分析模式 =====================
// 对局结束后逐步回放，每步用引擎评估偏差：≤30=✅好棋 ≤100=⚠️疑问手 >100=❌失误
// v7.5.0：逐手评价改用 ChessEngine.analyzePosition（复用主搜索的 PVS/LMR/静态搜索/TT，无时间盒），
// 替掉旧版裸 alpha-beta _analysisSearch——旧版无着法排序、无 TT、无静态搜索，战术局面在深度边界误判多。


function startAnalysis(g) {
    // 5.2.8：分开提示，别把"没结束"和"太短"混成一句
    if (!g.gameOver) { g.showToast('对局结束后才能复盘'); return; }
    if (g.sanHistory.length < 2) { g.showToast('对局太短，无法分析'); return; }
    if (g._analysisRunning) { g._stopAnalysis(); return; }
    g._analysisRunning = true; g._analysisPly = 0; g._analysisResults = [];
    // 5.2.8：historyStack[i] 存的是「第 i 手走之前」，末手取不到 historyStack[len]，
    //   补一条终局快照，最后一手的 actual 才解析得出来（否则复盘永远漏最新一手）
    const hist = g.historyStack.concat(g.lastMove ? [{ lastMove: JSON.parse(JSON.stringify(g.lastMove)) }] : []);
    g.selectedSquare = null; g.validMoves = [];
    g._updateAnalysisBtn(); g.showToast('正在复盘分析…');
    // v7.7.0：复盘深度由固定 3 层改为按局面阶段自适应。
    // 3 层足以看穿简单战术，但残局子力少、变化深，会把「两步后才暴露的失误」判成好棋、
    // 把实际最佳着法标成「偏差」。复盘跑在 Worker 里不卡界面，加深的代价只是分析稍慢。
    const _pieceCount = g.board.reduce((n, row) => n + row.reduce((c, p) => c + (p !== 0 ? 1 : 0), 0), 0);
    const DEPTH = _pieceCount > 20 ? 3 : 4;

    // v7.6.0：复盘分析改走 Worker（异步，不阻塞主线程），analyzePosition 用独立 TT 不污染实战搜索。
    // Worker 可用性直接用 EngineWorker.available（Worker 建立失败/运行期崩溃时为 false）
    const workerAvailable = EngineWorker.available;

    // ===== Worker 异步路径（主线程零引擎调用，dev/bestMove 全在 Worker 算）=====
    const stepWorker = async () => {
        if (!g._analysisRunning) return;
        if (g._analysisPly >= g.sanHistory.length) { g._finishAnalysis(); return; }
        const ply = g._analysisPly;
        const snap = hist[ply];
        const actual = hist[ply+1] ? hist[ply+1].lastMove : null;
        if (snap && actual) {
            const mover = snap.currentPlayer;
            let bestSc = -Infinity, bestM = null, dev = 0;
            try {
                // 单个 Worker 请求同时算：最佳着法/分值 + 实际着法偏差 dev（独立 analysisTT）
                const res = await EngineWorker.analyzeAsync({
                    board: snap.board, color: mover, castlingRights: snap.castlingRights,
                    enPassantTarget: snap.enPassantTarget, depth: DEPTH, actual: actual
                });
                if (res && res.ok && res.type === 'analyze') {
                    bestSc = res.bestScore;
                    bestM = res.bestMove;
                    dev = res.dev || 0;
                }
            } catch(e) { /* 单 ply 失败则跳过（不阻塞整体） */ }
            if (g._analysisRunning) {
                g._analysisResults.push({ ply, san: g.sanHistory[ply], dev, grade: dev<=30?'good':dev<=100?'q':'bad', best: bestM?_msan(bestM):'', fromM: actual.from, toM: actual.to });
                g._analysisPly++;
                // await 后已是异步续跑，无需 setTimeout 也能让出主线程；保留微任务兜底
                g._analysisTimer = setTimeout(stepWorker, 0);
            }
        } else {
            g._analysisPly++;
            g._analysisTimer = setTimeout(stepWorker, 0);
        }
    };

    // ===== 旧的同步回退路径（Worker 不可用）=====
    const stepSync = () => {
        if (!g._analysisRunning) return;
        // 5.2.7：对局被重开/回溯导致历史清空时优雅退出，避免无限 setTimeout 空转
        if (g._analysisPly >= g.sanHistory.length) { g._finishAnalysis(); return; }
        const ply = g._analysisPly;
        const snap = hist[ply];
        const actual = hist[ply+1] ? hist[ply+1].lastMove : null;
        if (snap && actual) {
            const mover = snap.currentPlayer;
            let bestSc = -Infinity, bestM = null;
            try {
                const raw = ChessEngine.generateMoves(snap.board, mover, snap.castlingRights, snap.enPassantTarget);
                for (const m of raw) {
                    const nb = ChessEngine.makeMove(snap.board, m);
                    if (ChessEngine.isInCheck(nb, mover)) continue;
                    const nc = ChessEngine.getCastlingRights(nb, snap.castlingRights);
                    const nep = ChessEngine.getEnPassantTarget(nb, m);
                    // v7.6.0：回退路径同样用独立 TT（每次 ply 新建，不污染实战共享表）
                    const sc = -ChessEngine.analyzePosition(nb, -mover, nc, nep, DEPTH - 1, new Map());
                    if (sc > bestSc) { bestSc = sc; bestM = m; }
                }
            } catch(e){}
            let dev = 0;
            const nb = ChessEngine.makeMove(snap.board, actual);
            { const nc = ChessEngine.getCastlingRights(nb, snap.castlingRights); const nep = ChessEngine.getEnPassantTarget(nb, actual);
              const sc = -ChessEngine.analyzePosition(nb, -mover, nc, nep, DEPTH - 1, new Map());
              dev = Math.abs(bestSc - sc); }
            g._analysisResults.push({ ply, san: g.sanHistory[ply], dev, grade: dev<=30?'good':dev<=100?'q':'bad', best: bestM?_msan(bestM):'', fromM: actual.from, toM: actual.to });
        }
        g._analysisPly++;
        setTimeout(stepSync, 0);
    };

    if (workerAvailable) { stepWorker(); }
    else { setTimeout(stepSync, 50); }
}
function _msan(m) { if (!m) return ''; if (m.castling==='K') return 'O-O'; if (m.castling==='Q') return 'O-O-O'; const t={2:'N',3:'B',4:'R',5:'Q',6:'K'}[Math.abs(m.piece)]||''; return t+FILES[m.from[1]]+(8-m.from[0])+'→'+FILES[m.to[1]]+(8-m.to[0]); }

// 启动游戏
const game = new ChessGame();

// 安卓返回键：先关设置面板/弹窗，都没有再退出 App。
// 返回 'handled' 表示已被页面消化，'exit' 表示可以让系统退回。
window.__androidBack = function () {
    try {
        if (game.practicePickerEl && game.practicePickerEl.classList.contains('show')) {
            game.closePracticePicker();
            return 'handled';
        }
        if (game.settingsOverlayEl && game.settingsOverlayEl.classList.contains('show')) {
            game.closeSettings();
            return 'handled';
        }
        if (game.modalEl && game.modalEl.classList.contains('show')) {
            game.hideModal();
            return 'handled';
        }
    } catch (e) { /* 出错则按退出处理 */ }
    return 'exit';
};
</script>
